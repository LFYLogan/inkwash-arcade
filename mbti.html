<title>问心局 · 雾隐城三日 · 墨戏五卷</title>
<meta name="description" content="你是初入雾隐城的旅人。二十四次抉择，照见一个四字人格。故事式 MBTI，纯前端离线可玩。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f16'/%3E%3Cpath d='M32 12v40M18 26h28M22 26v26M42 26v26M16 52h32' fill='none' stroke='%23c9a86a' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/theme.css">
<style>
  /* ============ 问心局 · 本页样式 ============ */
  #app { padding: 20px 0 0; }

  /* ---- 心灯进度 ---- */
  .hud { display: none; padding: 4px 2px 0; }
  .hud.is-on { display: block; }
  .hud__row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
  .hud__k { font-family: var(--font-serif); font-size: 13px; letter-spacing: 0.32em; color: var(--gold-dim); }
  .hud__k::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 9px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 10px rgba(232, 205, 151, 0.8);
    vertical-align: 2px;
  }
  .hud__count { font-size: 12px; letter-spacing: 0.06em; color: var(--text-dim); }
  .hud .meter { height: 4px; }
  .hud__act { margin-top: 9px; font-size: 10.5px; letter-spacing: 0.26em; color: var(--text-faint); }

  .stage { margin-top: 20px; }

  /* ---- 场景 ---- */
  .panel.scene { padding: 30px 30px 24px; }
  .scene__title { margin: 0 0 16px; font-size: clamp(24px, 4.4vw, 30px); letter-spacing: 0.08em; color: var(--text); }
  .scene__text {
    margin: 0;
    font-family: var(--font-serif);
    font-size: 16.5px;
    line-height: 2.05;
    letter-spacing: 0.02em;
    color: var(--text);
    text-align: justify;
  }

  /* ---- 选项 ---- */
  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
  .opt {
    display: flex; align-items: flex-start; gap: 13px;
    width: 100%; min-height: 56px;
    padding: 14px 16px;
    text-align: left;
    font-family: var(--font-sans);
    font-size: 15px; line-height: 1.62;
    color: var(--text);
    background: var(--w-01);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .opt:hover { border-color: var(--line); background: rgba(201, 168, 106, 0.075); }
  .opt:active { transform: scale(0.995); }
  .opt:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  .opt__no {
    flex: 0 0 auto;
    width: 23px; height: 23px; margin-top: 2px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    font-size: 11.5px;
    color: var(--gold);
  }
  .opt.is-picked { border-color: rgba(201, 168, 106, 0.6); background: rgba(201, 168, 106, 0.1); }
  .opt.is-picked .opt__no { background: var(--gold); border-color: var(--gold); color: var(--ink-0); }

  .scene__foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 20px; }
  button.back { border: 0; background: none; padding: 6px 0; cursor: pointer; font-family: var(--font-sans); }
  button.back:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
  .scene__foot .back { font-size: 12.5px; letter-spacing: 0.12em; }
  .hint { font-size: 11.5px; letter-spacing: 0.04em; color: var(--text-faint); }
  .kbd {
    display: inline-grid; place-items: center;
    min-width: 18px; height: 18px; margin: 0 2px; padding: 0 4px;
    font-family: var(--font-num); font-size: 10.5px; line-height: 1;
    color: var(--text-dim);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    background: var(--w-01);
  }

  /* ---- 卷首 ---- */
  .panel.intro { padding: 38px 38px 32px; overflow: hidden; }
  .intro__art { margin: -4px 0 18px; }
  .intro__art svg { display: block; width: 100%; height: auto; }
  .intro h1 { margin-bottom: 16px; }
  .intro h1 em { font-style: normal; color: var(--gold-bright); }
  .intro .lede {
    font-family: var(--font-serif);
    font-size: 16.5px; line-height: 2.05;
    letter-spacing: 0.02em;
    color: var(--text);
    text-align: justify;
  }
  .intro .lede + .lede { font-size: 15px; color: var(--text-dim); }
  .intro__meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 26px; }
  .intro__actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .intro__last { margin-top: 18px; font-size: 13px; color: var(--text-faint); }
  .linkish {
    border: 0; background: none; padding: 0;
    font: inherit; color: var(--gold-bright);
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .linkish:hover { color: var(--gold-bright); border-bottom-color: var(--gold); }
  .linkish:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }

  /* ---- 结果 ---- */
  .panel.result { padding: 34px 32px 28px; }
  .result__head { text-align: center; }
  .result__head .eyebrow { margin-bottom: 6px; }
  .code {
    font-family: var(--font-num);
    font-size: clamp(46px, 13vw, 68px);
    line-height: 1.06;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: var(--gold-bright);
  }
  .pname {
    margin: 12px 0 0;
    font-family: var(--font-serif);
    font-size: clamp(22px, 6vw, 27px);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--text);
  }
  .result__tag { margin-top: 10px; font-size: 10.5px; letter-spacing: 0.3em; color: var(--text-faint); }
  .tie { margin: 16px auto 0; max-width: 30em; font-size: 12.5px; letter-spacing: 0.04em; color: var(--jade-bright); }
  .sketch {
    margin: 22px 0 0;
    font-family: var(--font-serif);
    font-size: 16px; line-height: 2.1;
    letter-spacing: 0.02em;
    color: var(--text);
    text-align: justify;
  }

  .axes { display: grid; gap: 17px; }
  .axis__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 11px; letter-spacing: 0.2em; color: var(--text-faint); }
  .axis__row { display: grid; grid-template-columns: 60px 1fr 60px; gap: 10px; align-items: center; }
  .axis__end { font-family: var(--font-num); font-size: 13px; letter-spacing: 0.04em; color: var(--text-dim); white-space: nowrap; }
  .axis__end:last-child { text-align: right; }
  .axis__end b { font-weight: 400; }
  .axis__end.is-win { color: var(--gold-bright); }
  .axis__end.is-win b { color: var(--gold-bright); }
  .axis__track { position: relative; }
  .axis__track::after {
    content: "";
    position: absolute; left: 50%; top: -4px; bottom: -4px;
    width: 1px;
    background: rgba(201, 168, 106, 0.22);
    pointer-events: none;
  }
  .axis__track .bar { height: 7px; }
  .axis__note { margin-top: 7px; font-size: 12px; letter-spacing: 0.02em; color: var(--text-dim); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .easter {
    margin-top: 20px; padding: 16px 18px;
    border: 1px solid var(--line-soft);
    border-left: 2px solid var(--gold-dim);
    border-radius: 8px;
    background: rgba(201, 168, 106, 0.045);
  }
  .easter h3 {
    margin: 0 0 7px;
    font-family: var(--font-sans); font-weight: 400;
    font-size: 11px; letter-spacing: 0.24em;
    color: var(--gold-dim);
  }
  .easter p { margin: 0; font-size: 14px; line-height: 1.8; color: var(--text-dim); }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .actions .btn { flex: 1 1 auto; }
  .result__fine { margin: 20px 0 0; text-align: center; font-size: 11.5px; letter-spacing: 0.12em; color: var(--text-faint); }

  @media (max-width: 640px) {
    .panel.intro { padding: 26px 20px 24px; }
    .panel.scene { padding: 24px 18px 20px; }
    .panel.result { padding: 28px 18px 24px; }
    .scene__text, .intro .lede { font-size: 16px; line-height: 1.95; }
    .hint { display: none; }
    .axis__row { grid-template-columns: 52px 1fr 52px; gap: 8px; }
    .actions { flex-direction: column; }
    .actions .btn { width: 100%; }
  }
  @media (max-width: 380px) {
    .code { font-size: 43px; }
    .panel.scene { padding: 22px 15px 18px; }
    .opt { font-size: 14.5px; padding: 13px 14px; }
  }
</style>

    function pick(left, right, fallback) {
      if (scores[left] > scores[right]) return left;
      if (scores[left] < scores[right]) return right;
      tied = true;
      return fallback;
    }
    return {
      code: pick('E', 'I', 'E') + pick('S', 'N', 'N') + pick('T', 'F', 'T') + pick('J', 'P', 'J'),
      tie: tied,
    };
  }

  function axisPct(axis, scores) {
    const l = Number(scores[axis.left]) || 0;
    const r = Number(scores[axis.right]) || 0;
    const total = l + r;
    let lp = total > 0 ? Math.round((l / total) * 100) : 50;
    if (l !== r && lp === 50) lp = l > r ? 51 : 49;
    lp = Math.max(0, Math.min(100, lp));
    return { left: lp, right: 100 - lp, rawLeft: l, rawRight: r };
  }

  /* ---------- 卷首 ---------- */
  const ART = [
    '<svg viewBox="0 0 340 148" width="100%" height="auto" role="img" aria-label="雾中的城与塔">',
    '<path d="M0 124c42-6 66 4 102 0s62-9 96-3 66 10 142 4" fill="none" stroke="#6fa89a" stroke-width="1.1" opacity=".4"/>',
    '<path d="M0 133c48-5 74 5 112 0s66-8 104-2 76 7 124 2" fill="none" stroke="#6fa89a" stroke-width="1" opacity=".22"/>',
    '<path d="M22 116V96l9-7 9 7v20M50 116V90l11-9 11 9v26M274 116V94l10-8 10 8v22" fill="none" stroke="#6c8fc4" stroke-width="1.2" opacity=".5"/>',
    '<path d="M24 84h10M56 78h8M284 82h8" stroke="#c9a86a" stroke-width="1" opacity=".4"/>',
    '<path d="M148 118V58M176 118V58M140 58h44M144 76h36M148 94h28M152 110h20" fill="none" stroke="#c9a86a" stroke-width="1.3" opacity=".85"/>',
    '<path d="M160 40l-16 12h32z" fill="none" stroke="#e8cd97" stroke-width="1.4"/>',
    '<path d="M160 24v16" stroke="#e8cd97" stroke-width="1.2"/>',
    '<circle cx="160" cy="20" r="2.2" fill="#e8cd97" opacity=".9"/>',
    '<circle cx="256" cy="38" r="14" fill="none" stroke="#c9a86a" stroke-width="1.2" opacity=".65"/>',
    '<path d="M256 18v-6M256 64v-6M236 38h-6M282 38h-6" stroke="#8a744c" stroke-width="1" opacity=".45"/>',
    '<path d="M108 112c14-14 26-14 38-24M228 116c10-12 22-16 34-26" fill="none" stroke="#a9a49a" stroke-width="1" opacity=".16"/>',
    '<circle cx="84" cy="46" r="1.6" fill="#c9a86a" opacity=".6"/>',
    '<circle cx="98" cy="58" r="1.2" fill="#c9a86a" opacity=".4"/>',
    '<circle cx="70" cy="64" r="1.1" fill="#c9a86a" opacity=".35"/>',
    '</svg>',
  ].join('');

  function paintIntro() {
    state.view = 'intro';
    setHud(false);
    const resume = state.resume;
    const last = loadResult();
    const actions = [];

    if (resume) {
      actions.push(el('button', {
        class: 'btn',
        type: 'button',
        onclick: resumeRun,
      }, '续上一次（第 ' + (resume.index + 1) + ' 场）'));
      actions.push(el('button', {
        class: 'btn btn--ghost',
        type: 'button',
        onclick: newRun,
      }, '重新开始'));
    } else {
      actions.push(el('button', {
        class: 'btn',
        type: 'button',
        onclick: newRun,
      }, '入城'));
    }

    const kids = [
      el('div', { class: 'eyebrow', text: '卷一 · 问心局' }),
      el('h1', {}, ['雾隐城，', el('em', { text: '三日' }), '。']),
      el('div', { class: 'intro__art', html: ART }),
      el('p', {
        class: 'lede',
        text: '你是初入雾隐城的旅人。城里正出怪事：夜里有人敲一口不响的钟，井底有人念你的名字，茶棚里的人说，三日后塔上要开一场“照心”。',
      }),
      el('p', {
        class: 'lede',
        text: '你只剩三天。遇见的人、听见的话、伸出去又收回的手，会在你看不见的地方落成四个字。没有题目，也没有对错——只是照见。',
      }),
      el('div', { class: 'intro__meta' }, [
        el('span', { class: 'tag', text: '二十四场' }),
        el('span', { class: 'tag', text: '约八分钟' }),
        el('span', { class: 'tag', text: '进度自动存档' }),
      ]),
      el('div', { class: 'intro__actions' }, actions),
    ];

    if (last && !resume && TYPES[last.code]) {
      const t = TYPES[last.code];
      kids.push(el('p', { class: 'intro__last' }, [
        '上次照见：',
        el('button', {
          class: 'linkish',
          type: 'button',
          onclick: function () { showResult(last); },
        }, last.code + ' · ' + t.name),
      ]));
    }

    mountView(el('section', { class: 'panel intro' }, kids));
  }

  /* ---------- 场景 ---------- */
  function paintScene() {
    state.view = 'play';
    setHud(true);
    updateHud();

    const scene = SCENES[state.index];
    const picked = state.picks[state.index];
    const options = scene.opts.map(function (opt, k) {
      const classes = 'opt' + (picked === k ? ' is-picked' : '');
      return el('button', {
        class: classes,
        type: 'button',
        'aria-label': '选项 ' + (k + 1) + '：' + opt.t,
        onclick: function () { choose(k); },
      }, [
        el('span', { class: 'opt__no num', text: String(k + 1) }),
        el('span', { class: 'opt__t', text: opt.t }),
      ]);
    });

    const foot = [
      state.index > 0
        ? el('button', { class: 'back', type: 'button', onclick: back }, '← 上一场')
        : el('span', { class: 'faint', text: '灯已点起' }),
      el('span', { class: 'hint' }, [
        '按 ', el('span', { class: 'kbd num', text: '1' }), ' / ',
        el('span', { class: 'kbd num', text: '2' }), ' / ',
        el('span', { class: 'kbd num', text: '3' }), ' 落子，',
        el('span', { class: 'kbd num', text: '⌫' }), ' 退回上一场',
      ]),
    ];

    mountView(el('section', { class: 'panel scene' }, [
      el('div', { class: 'eyebrow', text: ACTS[scene.act] + ' · 其' + CN_NUM[state.index % 8] }),
      el('h1', { class: 'scene__title', text: scene.title }),
      el('p', { class: 'scene__text', text: scene.text }),
      el('div', { class: 'opts' }, options),
      el('div', { class: 'scene__foot' }, foot),
    ]));
  }

  function choose(k) {
    if (busy || state.view !== 'play') return;
    const scene = SCENES[state.index];
    if (!scene || !scene.opts[k]) return;

    state.picks[state.index] = k;
    for (let i = state.index + 1; i < TOTAL; i++) state.picks[i] = null;

    if (state.index === TOTAL - 1) {
      finish();
      return;
    }

    state.index += 1;
    saveProgress();
    busy = true;
    paintScene();
    unlock(380);
  }

  function back() {
    if (busy || state.view !== 'play') return;
    if (state.index === 0) {
      toast('这已是入城的第一步。');
      return;
    }
    state.index -= 1;
    saveProgress();
    busy = true;
    paintScene();
    unlock(320);
  }

  /* ---------- 结果 ---------- */
  function finish() {
    const scores = tally(state.picks);
    const verdict = decide(scores);
    const result = {
      v: 1,
      code: verdict.code,
      scores: scores,
      tie: verdict.tie,
      picks: state.picks.slice(),
      at: Date.now(),
    };
    store.set('mbti.result', result);
    store.del('mbti.progress');
    state.resume = null;
    state.result = result;
    busy = true;
    paintResult(result);
    unlock(460);
  }

  function makeCopy(result) {
    const t = TYPES[result.code];
    const pairs = AXES.map(function (axis) {
      const p = axisPct(axis, result.scores);
      return axis.left + p.left + ' ' + axis.right + p.right;
    });
    return '问心局 · ' + result.code + ' ' + t.name + '｜' + pairs.join(' ');
  }

  function legacyCopy(text) {
    let ok = false;
    let area = null;
    try {
      area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, area.value.length);
      ok = document.execCommand('copy');
    } catch (err) {
      ok = false;
    }
    if (area && area.parentNode) area.parentNode.removeChild(area);
    return ok;
  }

  function copyResult(result) {
    const text = makeCopy(result);
    const done = function () { toast('四字已抄下，收好。'); };
    const fail = function () { toast('没能抄下，长按结果也可。'); };
    const fallback = function () {
      if (legacyCopy(text)) done(); else fail();
    };
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        const task = navigator.clipboard.writeText(text);
        if (task && typeof task.then === 'function') task.then(done, fallback);
        else done();
      } else {
        fallback();
      }
    } catch (err) {
      fallback();
    }
  }

  function axisRow(axis, result) {
    const p = axisPct(axis, result.scores);
    const win = result.code.indexOf(axis.left) !== -1 ? axis.left : axis.right;
    const leftEnd = el('span', { class: 'axis__end' + (win === axis.left ? ' is-win' : '') }, [
      axis.left + ' ', el('b', { text: p.left + '%' }),
    ]);
    const rightEnd = el('span', { class: 'axis__end' + (win === axis.right ? ' is-win' : '') }, [
      el('b', { text: p.right + '%' }), ' ' + axis.right,
    ]);
    const fill = el('i');
    requestAnimationFrame(function () { fill.style.width = p.left + '%'; });

    return el('div', { class: 'axis' }, [
      el('div', { class: 'axis__head' }, [
        el('span', { text: axis.name + ' · ' + axis.key }),
        el('span', { class: 'num', text: p.rawLeft + ' : ' + p.rawRight }),
      ]),
      el('div', { class: 'axis__row' }, [
        leftEnd,
        el('div', { class: 'axis__track' }, el('div', { class: 'bar' }, fill)),
        rightEnd,
      ]),
      el('div', { class: 'axis__note', text: AXIS_NOTE[win] }),
    ]);
  }

  function paintResult(result) {
    state.view = 'result';
    setHud(false);
    const type = TYPES[result.code];
    if (!type) {
      toast('这笔字没有落成，请重走一次。');
      paintIntro();
      return;
    }

    const head = el('div', { class: 'result__head' }, [
      el('div', { class: 'eyebrow', text: '照心 · 四字已落' }),
      el('div', { class: 'code', text: result.code }),
      el('h1', { class: 'pname', text: type.name }),
      el('div', { class: 'result__tag', text: '问心局 · 卷终' }),
    ]);
    if (result.tie) {
      head.appendChild(el('p', {
        class: 'tie',
        text: '有一轴，你停在两可之间——局中不替你选，便照旧例取字。',
      }));
    }

    const axes = el('div', { class: 'axes' }, AXES.map(function (axis) {
      return axisRow(axis, result);
    }));

    const tags = el('div', { class: 'tags' }, type.tags.map(function (tag) {
      return el('span', { class: 'tag', text: tag });
    }));

    const easter = el('div', { class: 'easter' }, [
      el('h3', { text: '与你相合的城中之物' }),
      el('p', { text: type.affinity }),
    ]);

    const actions = el('div', { class: 'actions' }, [
      el('button', {
        class: 'btn',
        type: 'button',
        onclick: function () { copyResult(result); },
      }, '复制我的结果'),
      el('button', {
        class: 'btn btn--ghost',
        type: 'button',
        onclick: restart,
      }, '重走此城'),
    ]);

    mountView(el('section', { class: 'panel result' }, [
      head,
      el('hr', { class: 'rule' }),
      el('p', { class: 'sketch', text: type.sketch }),
      el('hr', { class: 'rule' }),
      axes,
      tags,
      easter,
      actions,
      el('p', { class: 'result__fine', text: '此局只照一面，不作定论。' }),
    ]));
  }

  function showResult(result) {
    state.result = result;
    paintResult(result);
  }

  /* ---------- 启程 / 重开 ---------- */
  function newRun() {
    state.index = 0;
    state.picks = blankPicks();
    state.resume = null;
    store.del('mbti.progress');
    paintScene();
    busy = true;
    unlock(320);
  }

  function resumeRun() {
    const p = state.resume;
    if (!p) {
      newRun();
      return;
    }
    state.index = p.index;
    state.picks = p.picks.slice();
    state.resume = null;
    paintScene();
    busy = true;
    unlock(320);
  }

  function restart() {
    store.del('mbti.progress');
    store.del('mbti.result');
    state.result = null;
    newRun();
    toast('雾重新起了。');
  }

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (state.view !== 'play') return;
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      e.preventDefault();
      choose(Number(e.key) - 1);
      return;
    }
    if (e.key === 'Backspace') {
      e.preventDefault();
      back();
    }
  });

  /* ---------- 启动 ---------- */
  DSHG.mountChrome({ title: '卷一 · 问心局', meta: 'STORY · MBTI' });
  state.resume = loadProgress();
  paintIntro();
})();
</script>
