<!doctype html>
<html lang="zh-CN">
<head>

<title>成语闯关 · 考公 · 墨戏五卷</title>
<meta name="description" content="四道关，一条一条记：释义猜成语、语境填词、末字接龙、褒贬快判，附学习卡与错题本。纯前端离线可玩。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f16'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h20' stroke='%23c9a86a' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='44' r='5' fill='none' stroke='%23e8cd97' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/theme.css">
<style>
  /* ============ 成语闯关 · 本页样式 ============ */
  #app { width: min(820px, calc(100% - 40px)); padding: 20px 0 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .linkish {
    border: 0; background: none; padding: 0;
    font: inherit; color: var(--gold-bright);
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .linkish:hover { border-bottom-color: var(--gold); }
  button.back { border: 0; background: none; padding: 6px 0; cursor: pointer; font-family: var(--font-sans); }
  .mode:focus-visible, .shelf__btn:focus-visible, .crow:focus-visible,
  .wrow:focus-visible, .lrow__btn:focus-visible, .pager__btn:focus-visible,
  .overlay__close:focus-visible, .linkish:focus-visible, button.back:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }

  /* ---- 首页 ---- */
  .home__head { padding-top: 8px; }
  .home__title { font-size: clamp(31px, 5.6vw, 46px); line-height: 1.3; margin-bottom: 14px; }
  .home__title em { font-style: normal; color: var(--gold-bright); }
  .lede {
    font-family: var(--font-serif);
    font-size: 16px; line-height: 1.98;
    color: var(--text); max-width: 35em; margin-bottom: 0;
    text-align: justify;
  }
  .lede--dim { font-size: 14px; color: var(--text-dim); margin-top: 10px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px; margin: 24px 0 0;
  }
  .stat {
    padding: 15px 14px 13px;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    background: linear-gradient(160deg, var(--surface), var(--surface-2));
    position: relative; overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, var(--gold), transparent);
    opacity: 0.65;
  }
  .stat__k { display: block; font-size: 11px; letter-spacing: 0.22em; color: var(--text-faint); }
  .stat__v {
    display: block; font-family: var(--font-num);
    font-size: clamp(25px, 6vw, 33px); line-height: 1.25;
    color: var(--gold-bright); margin: 3px 0 1px;
  }
  .stat__n { display: block; font-size: 10.5px; letter-spacing: 0.03em; color: var(--text-faint); }
  .stat--jade::before { background: linear-gradient(180deg, var(--jade), transparent); }
  .stat--jade .stat__v { color: var(--jade-bright); }
  .stat--cin::before { background: linear-gradient(180deg, var(--cinnabar), transparent); }
  .stat--cin .stat__v { color: var(--cinnabar-bright); }

  .study { margin-top: 18px; }
  .study__row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 7px;
    font-size: 11.5px; letter-spacing: 0.08em; color: var(--text-faint);
  }
  .study .meter { height: 5px; }

  .section-head { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
  .section-head h2 { margin: 0; font-size: 20px; }
  .section-head span { font-size: 10.5px; letter-spacing: 0.24em; color: var(--text-faint); }

  .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .mode {
    display: flex; flex-direction: column; gap: 4px;
    width: 100%; padding: 18px 17px 16px;
    text-align: left; font-family: var(--font-sans); color: inherit;
    border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    background: var(--w-01);
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .mode:hover { border-color: var(--line); background: rgba(201, 168, 106, 0.065); transform: translateY(-2px); }
  .mode[aria-disabled="true"] { opacity: 0.46; cursor: not-allowed; transform: none; }
  .mode[aria-disabled="true"]:hover { border-color: var(--line-soft); background: var(--w-01); }
  .mode__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mode__no { font-family: var(--font-serif); font-size: 13px; letter-spacing: 0.24em; color: var(--gold); }
  .mode__badge {
    font-size: 10.5px; letter-spacing: 0.06em; color: var(--text-faint);
    border: 1px solid var(--line-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }
  .mode__title { display: block; margin: 5px 0 1px; font-family: var(--font-serif); font-size: 21px; font-weight: 600; letter-spacing: 0.07em; color: var(--text); }
  .mode__desc { display: block; margin: 0; font-size: 13px; line-height: 1.66; color: var(--text-dim); }
  .mode__go {
    margin-top: 9px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; letter-spacing: 0.13em; color: var(--gold);
  }
  .mode__go::after { content: "→"; transition: transform 0.2s ease; }
  .mode:hover .mode__go::after { transform: translateX(4px); }
  .mode[aria-disabled="true"] .mode__go { color: var(--text-faint); }

  .shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .shelf__btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 14px 16px; text-align: left; font-family: var(--font-sans);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: transparent; color: var(--text); cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .shelf__btn:hover { background: rgba(201, 168, 106, 0.075); border-color: rgba(201, 168, 106, 0.45); }
  .shelf__btn b { font-family: var(--font-serif); font-size: 17px; font-weight: 600; letter-spacing: 0.06em; }
  .shelf__btn span { font-size: 11.5px; color: var(--text-faint); }

  .resume {
    margin-top: 14px; padding: 15px 17px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border: 1px dashed var(--line); border-radius: var(--radius-sm);
    background: rgba(201, 168, 106, 0.05);
  }
  .resume__txt { flex: 1; min-width: 190px; font-size: 13px; color: var(--text-dim); line-height: 1.65; }
  .resume__txt b { color: var(--gold-bright); font-weight: 600; font-family: var(--font-serif); font-size: 14.5px; }
  .resume__acts { display: flex; gap: 10px; flex-wrap: wrap; }

  .home__foot {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-top: 26px;
    font-size: 11.5px; color: var(--text-faint);
  }
  .home__foot .linkish { font-size: 12px; color: var(--text-dim); }
  .home__foot .linkish:hover { color: var(--gold-bright); }

  .notice {
    margin-top: 18px; padding: 12px 15px;
    border: 1px solid rgba(224, 96, 79, 0.32);
    background: rgba(184, 71, 60, 0.08);
    border-radius: var(--radius-sm);
    font-size: 13px; line-height: 1.75; color: var(--text-dim);
  }
  .notice b { color: var(--cinnabar-bright); }

  /* ---- 答题 ---- */
  .hud { padding: 2px 2px 0; margin-bottom: 16px; }
  .hud__row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .hud__k { font-family: var(--font-serif); font-size: 13px; letter-spacing: 0.26em; color: var(--gold-dim); }
  .hud__v { font-size: 12px; letter-spacing: 0.04em; color: var(--text-dim); }
  .hud .meter { height: 5px; }
  .hud__stats { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 11.5px; color: var(--text-faint); }
  .hud__stats b { font-family: var(--font-num); font-weight: 400; color: var(--gold-bright); font-size: 13px; }

  .panel.quiz { padding: 27px 28px 23px; }
  .qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .qhead__left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .qexit { font-size: 11.5px; color: var(--text-faint); border-bottom-color: transparent; letter-spacing: 0.08em; }
  .qexit:hover { color: var(--gold-bright); }
  .q-label {
    font-size: 10.5px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold-dim); margin-bottom: 10px;
  }
  .q-m {
    margin: 0; font-family: var(--font-serif);
    font-size: clamp(17px, 2.4vw, 20px); line-height: 1.95;
    color: var(--text); text-align: justify;
  }
  .q-e {
    margin: 0; font-family: var(--font-serif);
    font-size: clamp(17px, 2.4vw, 20px); line-height: 2.02;
    color: var(--text); text-align: justify;
  }
  .blank {
    display: inline-block; min-width: 3.6em; margin: 0 2px;
    color: var(--gold-bright); letter-spacing: 0.02em;
    border-bottom: 2px solid var(--gold); line-height: 1.5;
  }
  .chain { text-align: center; padding: 2px 0 4px; }
  .chain__word {
    font-family: var(--font-serif);
    font-size: clamp(38px, 9.5vw, 54px); line-height: 1.24;
    letter-spacing: 0.13em; text-indent: 0.13em; color: var(--text);
  }
  .chain__word i {
    font-style: normal; color: var(--gold-bright);
    border-bottom: 2px solid var(--gold);
  }
  .chain__arrow { font-family: var(--font-num); color: var(--gold-dim); font-size: 16px; letter-spacing: 0.24em; margin: 5px 0; }
  .chain__hint { font-size: 12px; letter-spacing: 0.06em; color: var(--text-faint); }
  .chain__note { margin-top: 7px; font-size: 11.5px; color: var(--jade-bright); }
  .polar { text-align: center; padding: 10px 0 6px; }
  .polar__word {
    font-family: var(--font-serif);
    font-size: clamp(45px, 12vw, 66px); line-height: 1.24;
    letter-spacing: 0.14em; text-indent: 0.14em; color: var(--gold-bright);
  }
  .polar__ask { margin-top: 8px; font-size: 12px; letter-spacing: 0.16em; color: var(--text-faint); }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .opt {
    display: flex; align-items: center; gap: 13px;
    width: 100%; min-height: 54px;
    padding: 13px 16px;
    text-align: left; font-family: var(--font-sans);
    color: var(--text);
    background: var(--w-01);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .opt:hover:not([disabled]) { border-color: var(--line); background: rgba(201, 168, 106, 0.075); transform: translateY(-1px); }
  .opt[disabled] { cursor: default; }
  .opt__no {
    flex: 0 0 auto; width: 23px; height: 23px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 50%;
    font-size: 11.5px; color: var(--gold);
  }
  .opt__t { flex: 1; font-family: var(--font-serif); font-size: 19px; letter-spacing: 0.09em; line-height: 1.45; }
  .opt__t--plain { font-family: var(--font-sans); font-size: 16px; letter-spacing: 0.12em; }
  .opt__mark { flex: 0 0 auto; width: 18px; font-size: 15px; opacity: 0; text-align: right; }
  .opt.is-right {
    border-color: rgba(148, 201, 186, 0.62);
    background: rgba(111, 168, 154, 0.13);
    animation: okPulse 0.44s ease;
  }
  .opt.is-right .opt__no { background: var(--jade); border-color: var(--jade); color: var(--ink-0); }
  .opt.is-right .opt__mark { opacity: 1; color: var(--jade-bright); }
  .opt.is-wrong {
    border-color: rgba(224, 96, 79, 0.6);
    background: rgba(184, 71, 60, 0.13);
    animation: noShake 0.4s ease;
  }
  .opt.is-wrong .opt__no { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff6f2; }
  .opt.is-wrong .opt__mark { opacity: 1; color: var(--cinnabar-bright); }
  .opt.is-muted { opacity: 0.5; }
  @keyframes okPulse { 0% { transform: scale(0.995); } 55% { transform: scale(1.008); } 100% { transform: none; } }
  @keyframes noShake {
    0%, 100% { transform: translateX(0); }
    22% { transform: translateX(-4px); }
    46% { transform: translateX(4px); }
    70% { transform: translateX(-2px); }
  }

  .qfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .hint { font-size: 11.5px; letter-spacing: 0.03em; color: var(--text-faint); }
  .kbd {
    display: inline-grid; place-items: center;
    min-width: 18px; height: 18px; margin: 0 2px; padding: 0 4px;
    font-family: var(--font-num); font-size: 10.5px; line-height: 1;
    color: var(--text-dim);
    border: 1px solid var(--line-soft); border-radius: 4px;
    background: var(--w-01);
  }

  .fb { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-soft); animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; scroll-margin-top: 80px; }
  .fb__verdict {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-serif); font-size: 17px; letter-spacing: 0.06em;
    margin-bottom: 15px;
  }
  .fb__icon {
    width: 27px; height: 27px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 50%; border: 1px solid; font-size: 13px;
  }
  .fb--ok .fb__verdict { color: var(--jade-bright); }
  .fb--ok .fb__icon { color: var(--jade-bright); border-color: rgba(148, 201, 186, 0.5); background: rgba(111, 168, 154, 0.13); }
  .fb--no .fb__verdict { color: var(--cinnabar-bright); }
  .fb--no .fb__icon { color: var(--cinnabar-bright); border-color: rgba(224, 96, 79, 0.5); background: rgba(184, 71, 60, 0.13); }
  .fb__combo { margin-left: auto; font-family: var(--font-num); font-size: 12px; letter-spacing: 0.04em; color: var(--text-faint); }
  .word { display: flex; align-items: baseline; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .word__w { font-family: var(--font-serif); font-size: clamp(27px, 5.6vw, 35px); letter-spacing: 0.16em; color: var(--text); }
  .word__tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag--jade { color: var(--jade-bright); border-color: rgba(148, 201, 186, 0.4); background: rgba(111, 168, 154, 0.1); }
  .tag--cin { color: var(--cinnabar-bright); border-color: rgba(224, 96, 79, 0.4); background: rgba(184, 71, 60, 0.1); }
  .tag--dim { color: var(--text-dim); border-color: var(--line-soft); background: var(--w-01); }
  .fb__m { margin: 0 0 10px; font-size: 14.5px; line-height: 1.9; color: var(--text); }
  .fb__e {
    margin: 0 0 8px; padding-left: 12px;
    border-left: 2px solid var(--line);
    font-family: var(--font-serif); font-size: 14.5px; line-height: 1.9;
    color: var(--text-dim); text-align: justify;
  }
  .fb__e .hit { color: var(--gold-bright); }
  .fb__y { margin: 7px 0 0; font-size: 12.5px; letter-spacing: 0.03em; color: var(--cinnabar-bright); }
  .fb__link { margin: 7px 0 0; font-size: 12.5px; color: var(--jade-bright); letter-spacing: 0.03em; }
  .fb__cmp {
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid rgba(184, 71, 60, 0.34);
    border-radius: 9px; background: rgba(184, 71, 60, 0.075);
    font-size: 13.3px; line-height: 1.8; color: var(--text-dim);
  }
  .fb__cmp b { color: var(--text); font-weight: 600; font-family: var(--font-serif); letter-spacing: 0.05em; }
  .fb__cmp p { margin: 0; color: inherit; }
  .fb__cmp p + p { margin-top: 6px; }
  .fb__acts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 19px; }
  .fb__acts .hint { margin-left: auto; }

  /* ---- 结算 ---- */
  .result__head { text-align: center; }
  .result__head .eyebrow { margin-bottom: 8px; }
  .result__big {
    font-family: var(--font-num); line-height: 1.12;
    font-size: clamp(44px, 11vw, 62px); color: var(--gold-bright);
    letter-spacing: 0.03em;
  }
  .result__big small { font-family: var(--font-sans); font-size: 13px; letter-spacing: 0.1em; color: var(--text-faint); margin-left: 8px; }
  .result__title { margin: 12px 0 0; font-size: clamp(20px, 3.4vw, 25px); color: var(--text); }
  .metrics { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .metric {
    min-width: 94px; padding: 10px 14px;
    border: 1px solid var(--line-soft); border-radius: 9px;
    background: var(--w-01);
  }
  .metric b { display: block; font-family: var(--font-num); font-weight: 400; font-size: 19px; line-height: 1.3; color: var(--text); }
  .metric span { display: block; font-size: 10.5px; letter-spacing: 0.16em; color: var(--text-faint); }
  .cum { display: flex; align-items: center; justify-content: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 16px; }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--text-faint); }
  .chip b { font-family: var(--font-num); font-weight: 400; font-size: 14px; color: var(--gold-bright); }
  .learnlist { display: flex; flex-direction: column; gap: 8px; }
  .lrow {
    border: 1px solid var(--line-soft); border-radius: 9px;
    background: var(--w-01); overflow: hidden;
  }
  .lrow__btn {
    display: flex; align-items: center; gap: 9px;
    width: 100%; min-height: 50px; padding: 11px 14px;
    background: none; border: 0; color: var(--text);
    font-family: var(--font-sans); text-align: left; cursor: pointer;
  }
  .lrow__btn:hover { background: rgba(201, 168, 106, 0.06); }
  .lrow__w { font-family: var(--font-serif); font-size: 18px; letter-spacing: 0.09em; flex: 0 0 auto; }
  .lrow__m {
    flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lrow__chan { flex: 0 0 auto; font-size: 10.5px; color: var(--text-faint); transition: transform 0.2s ease; }
  .lrow.is-open .lrow__chan { transform: rotate(180deg); }
  .lrow__body { padding: 2px 14px 14px; font-size: 13.3px; line-height: 1.85; color: var(--text-dim); }
  .lrow__body[hidden] { display: none; }
  .lrow__body .fb__e { font-size: 13.3px; }
  .result__acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .result__fine { margin: 18px 0 0; font-size: 11.5px; color: var(--text-faint); text-align: center; }
  .result__section { margin-top: 24px; }

  /* ---- 学习卡 ---- */
  .cards-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .cards-head h1 { margin: 2px 0 0; }
  .cards-head__act { display: flex; gap: 10px; flex-wrap: wrap; }
  .cards-panel { margin-top: 18px; padding: 22px 24px; scroll-margin-top: 80px; }
  .toolbar { display: flex; flex-direction: column; gap: 10px; }
  .search { position: relative; }
  .search input {
    width: 100%; min-height: 46px;
    padding: 10px 14px 10px 42px;
    font-family: inherit; font-size: 14.5px; color: var(--text);
    background: var(--w-01);
    border: 1px solid var(--line-soft); border-radius: 9px;
  }
  .search input::placeholder { color: var(--text-faint); }
  .search input:focus { outline: none; border-color: rgba(201, 168, 106, 0.55); box-shadow: 0 0 0 3px rgba(201, 168, 106, 0.1); }
  .search::before {
    content: "搜"; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-serif); font-size: 13px; color: var(--gold-dim);
    pointer-events: none;
  }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; }
  .filters select {
    flex: 1; min-width: 132px; min-height: 42px;
    padding: 8px 12px;
    font-family: inherit; font-size: 13.5px; color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line-soft); border-radius: 8px;
  }
  .count-line {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    margin: 16px 0 10px; font-size: 11.5px; color: var(--text-faint);
    letter-spacing: 0.03em;

<script>
(function () {
  'use strict';

  /* ===== CORE:BEGIN 纯逻辑（无 DOM，可被 Node 自测） ===== */
  const KIND = { MEANING: 'meaning', CLOZE: 'cloze', CHAIN: 'chain', POLAR: 'polar' };
  const POLARITIES = ['褒义', '贬义', '中性'];

  function isHanzi(ch) {
    const c = ch.codePointAt(0);
    return (c >= 0x3400 && c <= 0x4dbf) || (c >= 0x4e00 && c <= 0x9fff) ||
      (c >= 0xf900 && c <= 0xfaff) || (c >= 0x20000 && c <= 0x2ebef);
  }

  function firstChar(word) { return Array.from(word)[0]; }
  function lastChar(word) {
    const chars = Array.from(word);
    return chars[chars.length - 1];
  }

  function normalizeData(raw) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    const seen = new Set();
    for (let i = 0; i < raw.length; i += 1) {
      const it = raw[i];
      if (!it || typeof it !== 'object') continue;
      const w = typeof it.w === 'string' ? it.w.trim() : '';
      const chars = Array.from(w);
      if (chars.length !== 4 || !chars.every(isHanzi)) continue;
      if (seen.has(w)) continue;
      const m = typeof it.m === 'string' ? it.m.trim() : '';
      if (!m) continue;
      const e = typeof it.e === 'string' ? it.e.trim() : '';
      const k = POLARITIES.indexOf(it.k) !== -1 ? it.k : '中性';
      const g = typeof it.g === 'string' && it.g.trim() ? it.g.trim() : '未分类';
      const y = typeof it.y === 'string' ? it.y.trim() : '';
      seen.add(w);
      out.push({ w: w, m: m, e: e, k: k, g: g, y: y, hasExample: !!e && e.indexOf(w) !== -1 });
    }
    return out;
  }

  function makeDeck(list) {
    const byFirst = new Map();
    const byLast = new Map();
    const byGroup = new Map();
    const byW = new Map();
    for (let i = 0; i < list.length; i += 1) {
      const it = list[i];
      byW.set(it.w, it);
      const f = firstChar(it.w);
      const l = lastChar(it.w);
      if (!byFirst.has(f)) byFirst.set(f, []);
      byFirst.get(f).push(it);
      if (!byLast.has(l)) byLast.set(l, []);
      byLast.get(l).push(it);
      if (!byGroup.has(it.g)) byGroup.set(it.g, []);
      byGroup.get(it.g).push(it);
    }
    const startable = list.filter(function (it) {
      const next = byFirst.get(lastChar(it.w)) || [];
      return next.some(function (x) { return x.w !== it.w; });
    });
    return {
      list: list,
      size: list.length,
      byFirst: byFirst,
      byLast: byLast,
      byGroup: byGroup,
      byW: byW,
      startable: startable,
    };
  }

  function shuffleCopy(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sample(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function takeDistinct(source, count, used) {
    const out = [];
    for (let i = 0; i < source.length && out.length < count; i += 1) {
      const it = source[i];
      if (used.has(it.w)) continue;
      used.add(it.w);
      out.push(it);
    }
    return out;
  }

  function poolOf(deck, opts) {
    let pool = deck.list;
    if (opts && Array.isArray(opts.pool) && opts.pool.length) {
      pool = opts.pool.map(function (x) {
        return typeof x === 'string' ? deck.byW.get(x) : x;
      }).filter(function (x) {
        return x && typeof x.w === 'string' && deck.byW.has(x.w);
      });
    }
    if (!pool.length) pool = deck.list;
    if (opts && opts.exclude) {
      const ex = opts.exclude instanceof Set ? opts.exclude : new Set(opts.exclude);
      const filtered = pool.filter(function (x) { return !ex.has(x.w); });
      if (filtered.length) pool = filtered;
    }
    return pool;
  }

  function makeMeaning(deck, opts) {
    if (!deck || deck.size < 4) return null;
    const pool = poolOf(deck, opts);
    if (!pool.length) return null;
    const correct = sample(pool);
    const used = new Set([correct.w]);
    const others = deck.list.filter(function (x) { return x.w !== correct.w; });
    const tol = Math.max(6, Math.round(correct.m.length * 0.45));
    const near = others.filter(function (x) {
      return Math.abs(x.m.length - correct.m.length) <= tol;
    });
    const distract = takeDistinct(shuffleCopy(near), 3, used);
    if (distract.length < 3) {
      const rest = shuffleCopy(others.filter(function (x) { return !used.has(x.w); }));
      distract.push.apply(distract, takeDistinct(rest, 3 - distract.length, used));
    }
    if (distract.length < 3) return null;
    const options = shuffleCopy([correct].concat(distract));
    return {
      kind: KIND.MEANING,
      target: correct.w,
      options: options.map(function (x) { return x.w; }),
      answer: options.findIndex(function (x) { return x.w === correct.w; }),
      from: null,
      required: null,
      restarted: false,
    };
  }

  function makeCloze(deck, opts) {
    if (!deck || deck.size < 4) return null;
    const pool = poolOf(deck, opts).filter(function (x) { return x.hasExample; });
    if (!pool.length) return null;
    const correct = sample(pool);
    const used = new Set([correct.w]);
    const sameGroup = deck.list.filter(function (x) {
      return x.g === correct.g && x.w !== correct.w;
    });
    const distract = takeDistinct(shuffleCopy(sameGroup), 3, used);
    if (distract.length < 3) {
      const rest = shuffleCopy(deck.list.filter(function (x) { return x.w !== correct.w; }));
      distract.push.apply(distract, takeDistinct(rest, 3 - distract.length, used));
    }
    if (distract.length < 3) return null;
    const options = shuffleCopy([correct].concat(distract));
    return {
      kind: KIND.CLOZE,
      target: correct.w,
      options: options.map(function (x) { return x.w; }),
      answer: options.findIndex(function (x) { return x.w === correct.w; }),
      from: null,
      required: null,
      restarted: false,
    };
  }

  function makeChain(deck, fromW) {
    if (!deck || deck.size < 5 || !deck.startable.length) return null;
    let start = null;
    let restarted = false;
    if (fromW && deck.byW.has(fromW)) {
      const prev = deck.byW.get(fromW);
      const nexts = deck.byFirst.get(lastChar(prev.w)) || [];
      if (nexts.some(function (x) { return x.w !== prev.w; })) start = prev;
      else restarted = true;
    }
    if (!start) {
      start = sample(deck.startable);
      if (!start) return null;
      if (fromW) restarted = true;
    }
    const last = lastChar(start.w);
    const succ = (deck.byFirst.get(last) || []).filter(function (x) { return x.w !== start.w; });
    if (!succ.length) return null;
    const correct = sample(succ);
    const used = new Set([start.w, correct.w]);
    const others = deck.list.filter(function (x) { return firstChar(x.w) !== last; });
    const distract = takeDistinct(shuffleCopy(others), 3, used);
    if (distract.length < 3) return null;
    const options = shuffleCopy([correct].concat(distract));
    return {
      kind: KIND.CHAIN,
      target: correct.w,
      options: options.map(function (x) { return x.w; }),
      answer: options.findIndex(function (x) { return x.w === correct.w; }),
      from: start.w,
      required: last,
      restarted: restarted,
    };
  }

  function makePolar(deck, opts) {
    if (!deck || !deck.size) return null;
    const pool = poolOf(deck, opts);
    if (!pool.length) return null;
    const correct = sample(pool);
    const options = shuffleCopy(POLARITIES);
    return {
      kind: KIND.POLAR,
      target: correct.w,
      options: options,
      answer: options.indexOf(correct.k),
      from: null,
      required: null,
      restarted: false,
    };
  }

  function makeQuestion(kind, deck, opts) {
    if (!deck || !deck.size) return null;
    if (kind === KIND.MEANING) return makeMeaning(deck, opts);
    if (kind === KIND.CLOZE) return makeCloze(deck, opts);
    if (kind === KIND.CHAIN) return makeChain(deck, opts && opts.from);
    if (kind === KIND.POLAR) return makePolar(deck, opts);
    return null;
  }

  function isQuestionShape(q, deck) {
    if (!q || typeof q !== 'object' || !deck) return false;
    const kinds = [KIND.MEANING, KIND.CLOZE, KIND.CHAIN, KIND.POLAR];
    if (kinds.indexOf(q.kind) === -1) return false;
    if (typeof q.target !== 'string' || !deck.byW.has(q.target)) return false;
    if (!Array.isArray(q.options) || !Number.isInteger(q.answer)) return false;
    if (q.answer < 0 || q.answer >= q.options.length) return false;
    if (q.options.some(function (o) { return typeof o !== 'string'; })) return false;
    if (new Set(q.options).size !== q.options.length) return false;
    if (q.kind === KIND.POLAR) {
      if (q.options.length !== 3) return false;
      if (POLARITIES.indexOf(q.options[q.answer]) === -1) return false;
      return q.options[q.answer] === deck.byW.get(q.target).k;
    }
    if (q.options.length !== 4) return false;
    if (q.options[q.answer] !== q.target) return false;
    for (let i = 0; i < q.options.length; i += 1) {
      if (!deck.byW.has(q.options[i])) return false;
    }
    if (q.kind === KIND.CHAIN) {
      if (typeof q.from !== 'string' || !deck.byW.has(q.from)) return false;
      if (q.required !== lastChar(q.from)) return false;
      if (firstChar(q.target) !== q.required) return false;
    }
    return true;
  }

  function emptyProgress() {
    return { seen: {}, wrong: [], learned: [] };
  }

  function normalizeProgress(raw, knownWords) {
    const out = emptyProgress();
    if (!raw || typeof raw !== 'object') return out;
    const known = knownWords ? (knownWords instanceof Set ? knownWords : new Set(knownWords)) : null;
    const src = raw.seen && typeof raw.seen === 'object' ? raw.seen : {};
    Object.keys(src).forEach(function (w) {
      if (known && !known.has(w)) return;
      const e = src[w];
      if (!e || typeof e !== 'object') return;
      const r = Math.max(0, Math.floor(Number(e.r) || 0));
      const wc = Math.max(0, Math.floor(Number(e.w) || 0));
      const t = Number.isFinite(Number(e.t)) ? Number(e.t) : 0;
      const f = Math.max(0, Math.floor(Number(e.f) || 0));
      out.seen[w] = { r: r, w: wc, t: t, f: f };
    });
    if (Array.isArray(raw.wrong)) {
      raw.wrong.forEach(function (w) {
        if (typeof w !== 'string' || !out.seen[w]) return;
        if (out.wrong.indexOf(w) === -1) out.wrong.push(w);
      });
    }
    if (Array.isArray(raw.learned)) {
      raw.learned.forEach(function (w) {
        if (typeof w !== 'string' || !out.seen[w]) return;
        if (out.learned.indexOf(w) === -1) out.learned.push(w);
      });
    }
    Object.keys(out.seen).forEach(function (w) {
      if (out.learned.indexOf(w) === -1) out.learned.push(w);
    });
    return out;
  }

  function statsOf(p) {
    let mastered = 0;
    const keys = Object.keys(p.seen);
    for (let i = 0; i < keys.length; i += 1) {
      const e = p.seen[keys[i]];
      if (e.r >= 2 && e.w <= 1) mastered += 1;
    }
    return { learned: keys.length, mastered: mastered, wrong: p.wrong.length };
  }

  function recordAnswer(p, word, ok, now) {
    if (!p || !word) return { isNew: false, cleared: false, mastered: false };
    const isNew = !p.seen[word];
    if (!p.seen[word]) p.seen[word] = { r: 0, w: 0, t: 0, f: 0 };
    const e = p.seen[word];
    if (ok) e.r += 1;
    else e.w += 1;
    e.t = now || Date.now();
    if (p.learned.indexOf(word) === -1) p.learned.push(word);
    let cleared = false;
    if (ok) {
      if (p.wrong.indexOf(word) !== -1) {
        e.f = (e.f || 0) + 1;
        if (e.f >= 2) {
          p.wrong.splice(p.wrong.indexOf(word), 1);
          e.f = 0;
          cleared = true;
        }
      }
    } else {
      e.f = 0;
      if (p.wrong.indexOf(word) === -1) p.wrong.push(word);
    }
    return { isNew: isNew, cleared: cleared, mastered: e.r >= 2 && e.w <= 1 };
  }
