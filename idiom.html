  }

  function fmtDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function unique(arr) {
    const out = [];
    for (let i = 0; i < arr.length; i += 1) {
      if (out.indexOf(arr[i]) === -1) out.push(arr[i]);
    }
    return out;
  }

  function clampInt(v, min, max, fallback) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, Math.floor(n)));
  }

  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function scrollTop() {
    try { window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); }
    catch (err) { window.scrollTo(0, 0); }
  }

  function tag(text, cls) {
    return el('span', { class: 'tag' + (cls ? ' ' + cls : ''), text: text });
  }

  function polarTag(kind) {
    if (kind === '褒义') return tag(kind, 'tag--jade');
    if (kind === '贬义') return tag(kind, 'tag--cin');
    return tag(kind, 'tag--dim');
  }

  function idiomTags(it, withGroup) {
    const kids = [polarTag(it.k)];
    if (withGroup) kids.push(tag(it.g, 'tag--dim'));
    return el('div', { class: 'word__tags' }, kids);
  }

  function exampleNode(it, cls) {
    const node = el('p', { class: cls || 'fb__e' });
    if (!it.e) {
      node.textContent = '（这条成语暂时没有例句）';
      return node;
    }
    const parts = it.e.split(it.w);
    for (let i = 0; i < parts.length; i += 1) {
      if (i > 0) node.appendChild(el('span', { class: 'hit', text: it.w }));
      if (parts[i]) node.appendChild(document.createTextNode(parts[i]));
    }
    return node;
  }

  function metric(value, label) {
    return el('div', { class: 'metric' }, [
      el('b', { class: 'num', text: value }),
      el('span', { text: label }),
    ]);
  }

  function statChip(label, value) {
    return el('span', { class: 'chip' }, [
      label, el('b', { text: String(value) }),
    ]);
  }

  function emptyPanel(mark, title, text, actions, small) {
    return el('div', { class: 'empty' + (small ? ' empty--sm' : '') }, [
      el('div', { class: 'empty__mark', text: mark }),
      el('h3', { text: title }),
      el('p', { text: text }),
      actions || null,
    ]);
  }

  function announce(text) {
    if (live) live.textContent = text;
  }

  /* ---------- 存档 ---------- */
  function saveProgress() {
    store.set('idiom.progress', state.progress);
  }

  function saveRun() {
    const run = state.run;
    if (!run || run.finished) {
      store.del('idiom.run');
      return;
    }
    const data = {
      mode: run.mode,
      total: run.total,
      answered: run.answered,
      correct: run.correct,
      wrong: run.wrong,
      streak: run.streak,
      best: run.best,
      score: run.score,
      startedAt: run.startedAt,
      elapsedMs: run.elapsedMs,
      round: run.round,
      newWords: run.newWords,
      pool: run.pool,
      q: run.q,
      chosen: run.chosen,
      lastOk: run.lastOk,
      chainFrom: run.chainFrom,
      remainMs: run.mode === 'polar' ? Math.max(0, run.deadline - Date.now()) : null,
      savedAt: Date.now(),
    };
    store.set('idiom.run', data);
  }

  function loadRun() {
    const raw = store.get('idiom.run', null);
    if (!raw || typeof raw !== 'object' || raw.finished) return null;
    const mode = raw.mode;
    if (['meaning', 'cloze', 'chain', 'polar', 'wrong'].indexOf(mode) === -1) return null;
    if (!state.deck || !state.deck.size) return null;
    if (!isQuestionShape(raw.q, state.deck)) return null;
    if (!Array.isArray(raw.round) || !Array.isArray(raw.newWords)) return null;
    const kindOk = mode === 'chain' ? raw.q.kind === KIND.CHAIN
      : mode === 'polar' ? raw.q.kind === KIND.POLAR
        : (raw.q.kind === KIND.MEANING || raw.q.kind === KIND.CLOZE);
    if (!kindOk) return null;
    const pool = mode === 'wrong' && Array.isArray(raw.pool)
      ? raw.pool.filter(function (w) { return state.deck.byW.has(w); })
      : null;
    if (mode === 'wrong' && (!pool || !pool.length)) return null;
    const remain = Number(raw.remainMs);
    if (mode === 'polar' && (!Number.isFinite(remain) || remain <= 0)) return null;
    const total = mode === 'chain' || mode === 'polar' ? null : 10;
    const run = {
      mode: mode,
      total: total,
      answered: clampInt(raw.answered, 0, total || 100000, 0),
      correct: clampInt(raw.correct, 0, 100000, 0),
      wrong: clampInt(raw.wrong, 0, 100000, 0),
      streak: clampInt(raw.streak, 0, 100000, 0),
      best: clampInt(raw.best, 0, 100000, 0),
      score: Number.isFinite(Number(raw.score)) ? Number(raw.score) : 0,
      startedAt: Number(raw.startedAt) || Date.now(),
      elapsedMs: Math.max(0, Number(raw.elapsedMs) || 0),
      qShownAt: Date.now(),
      round: raw.round.filter(function (r) {
        return r && typeof r.w === 'string' && state.deck.byW.has(r.w);
      }).map(function (r) { return { w: r.w, ok: !!r.ok }; }),
      newWords: raw.newWords.filter(function (w) { return typeof w === 'string' && state.deck.byW.has(w); }),
      pool: pool,
      q: raw.q,
      chosen: Number.isInteger(raw.chosen) && raw.chosen >= 0 && raw.chosen < raw.q.options.length ? raw.chosen : null,
      lastOk: typeof raw.lastOk === 'boolean' ? raw.lastOk : null,
      chainFrom: typeof raw.chainFrom === 'string' ? raw.chainFrom : null,
      deadline: mode === 'polar' ? Date.now() + remain : 0,
      finished: false,
    };
    if (run.total && run.answered > run.total) run.answered = run.total;
    if (run.chosen !== null && run.lastOk === null) run.chosen = null;
    if (run.chosen !== null && run.answered < 1) run.chosen = null;
    return run;
  }

  /* ---------- 视图切换 ---------- */
  function mount(node, opts) {
    stage.replaceChildren(node);
    const o = opts || {};
    if (lastView !== state.view || o.animate !== false) {
      node.classList.add('screen');
    }
    lastView = state.view;
    if (o.scroll === 'feedback') {
      const fb = node.querySelector('.fb');
      if (fb) {
        requestAnimationFrame(function () {
          try { fb.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
          catch (err) { fb.scrollIntoView(); }
        });
        return;
      }
    }
    if (o.scroll !== 'keep') scrollTop();
  }

  /* ---------- 首页 ---------- */
  function paintHome() {
    state.view = 'home';
    stopTimer();
    if (state.run) state.resume = state.run;
    else state.resume = loadRun();

    const stats = statsOf(state.progress);
    const total = state.deck.size;
    const pct = total ? Math.min(100, (stats.learned / total) * 100) : 0;
    const root = el('div', { class: 'home' });

    root.appendChild(el('section', { class: 'home__head' }, [
      el('div', { class: 'eyebrow', text: '成语闯关 · 考公 / 事业单位' }),
      el('h1', { class: 'home__title' }, ['四道关，', el('em', { text: '一条一条' }), '记。']),
      el('p', {
        class: 'lede',
        text: '不追求一次考倒你。每答一题，都把这条成语的释义、例句、感情色彩与易错字摊开看一遍。练得多了，自然就记住了。',
      }),
      el('p', {
        class: 'lede lede--dim',
        text: '四种题型全部由题库自动生成；进度只存在本机浏览器里，关掉页面也还在。',
      }),
    ]));

    root.appendChild(el('section', { class: 'stats', 'aria-label': '学习统计' }, [
      statCard('已学', stats.learned, '见过至少一次', ''),
      statCard('掌握', stats.mastered, '对 ≥2 · 错 ≤1', 'stat--jade'),
      statCard('错题', stats.wrong, '答对两次移出', 'stat--cin'),
    ]));

    const barFill = el('i', { id: 'homeBar' });
    root.appendChild(el('div', { class: 'study' }, [
      el('div', { class: 'study__row' }, [
        el('span', { text: '题库覆盖' }),
        el('span', { class: 'num', text: stats.learned + ' / ' + total }),
      ]),
      el('div', {
        class: 'meter', role: 'progressbar',
        'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(stats.learned),
        'aria-label': '题库覆盖进度',
      }, barFill),
    ]));

    if (total === 0) {
      root.appendChild(el('div', { class: 'notice' }, [
        el('b', { text: '题库没有加载出来。' }),
        ' 请确认 data/idioms.js 正常引用了 window.IDIOM_DATA，然后刷新页面。学习卡暂时为空，其余入口会在数据恢复后自动可用。',
      ]));
    } else if (total < 4) {
      root.appendChild(el('div', { class: 'notice' }, [
        el('b', { text: '题库只有 ' + total + ' 条。' }),
        ' 四选一至少需要 4 条成语，接龙还要首尾接得上（至少 5 条），现在暂时锁住；褒贬快判与学习卡可以先玩。',
      ]));
    }

    root.appendChild(el('div', { class: 'section-head' }, [
      el('h2', { text: '选一道关' }),
      el('span', { text: 'FOUR MODES' }),
    ]));

    const modes = el('div', { class: 'modes' });
    ['meaning', 'cloze', 'chain', 'polar'].forEach(function (key, i) {
      modes.appendChild(buildModeCard(key, total, i));
    });
    root.appendChild(modes);

    root.appendChild(el('div', { class: 'shelf' }, [
      el('button', {
        class: 'shelf__btn', type: 'button', onclick: paintCards,
      }, [
        el('b', { text: '学习卡' }),
        el('span', { text: total + ' 条成语 · 可搜、可筛、每页 30 条' }),
      ]),
      el('button', {
        class: 'shelf__btn', type: 'button', onclick: paintWrong,
      }, [
        el('b', { text: '错题本' }),
        el('span', { text: stats.wrong ? stats.wrong + ' 条待巩固 · 答对两次移出' : '暂无错题，保持住' }),
      ]),
    ]));

    if (state.resume) {
      const r = state.resume;
      const info = MODE_INFO[r.mode] || MODE_INFO.meaning;
      let where = '';
      if (r.mode === 'polar') where = '还剩约 ' + Math.ceil(Math.max(0, r.deadline - Date.now()) / 1000) + ' 秒';
      else if (r.mode === 'chain') where = '已连对 ' + r.streak + ' 题 · 得分 ' + r.score;
      else where = '第 ' + Math.min((r.answered || 0) + (r.chosen === null ? 1 : 0), r.total) + ' / ' + r.total + ' 题';
      root.appendChild(el('div', { class: 'resume' }, [
        el('div', { class: 'resume__txt' }, [
          '上次停在 ', el('b', { text: info.name }), ' · ' + where + '。',
        ]),
        el('div', { class: 'resume__acts' }, [
          el('button', { class: 'btn', type: 'button', onclick: resumeRun }, '继续上次'),
          el('button', {
            class: 'btn btn--ghost', type: 'button',
            onclick: function () {
              store.del('idiom.run');
              state.run = null;
              state.resume = null;
              toast('已放弃上次的进度。');
              paintHome();
            },
          }, '放弃'),
        ]),
      ]));
    }

    root.appendChild(el('div', { class: 'home__foot' }, [
      el('button', { class: 'linkish', type: 'button', onclick: confirmClear }, '清空进度'),
      el('span', { text: '掌握 = 答对 ≥2 次且答错 ≤1 次；错题答对 2 次后移出' }),
    ]));

    mount(root);
    requestAnimationFrame(function () {
      if (barFill) barFill.style.width = pct.toFixed(2) + '%';
    });
    qsa('[data-count]', root).forEach(function (node) {
      const target = Number(node.getAttribute('data-count')) || 0;
      if (reduceMotion()) { node.textContent = String(target); return; }
      countTo(node, 0, target, 650);
    });
  }

  function statCard(label, value, note, cls) {
    return el('div', { class: 'stat' + (cls ? ' ' + cls : '') }, [
      el('span', { class: 'stat__k', text: label }),
      el('span', { class: 'stat__v num', 'data-count': String(value), text: '0' }),
      el('span', { class: 'stat__n', text: note }),
    ]);
  }

  function buildModeCard(key, total, index) {
    const info = MODE_INFO[key];
    let disabled = false;
    let why = '';
    if (key === 'polar') {
      if (total < 1) { disabled = true; why = '题库还是空的'; }
    } else if (key === 'chain') {
      if (total < 5) { disabled = true; why = '题库需至少 5 条'; }
      else if (!state.deck.startable.length) { disabled = true; why = '暂无可以接龙的组合'; }
    } else if (total < 4) {
      disabled = true;
      why = '题库需至少 4 条';
    }
    const card = el('button', {
      class: 'mode fade-up', type: 'button',
      'aria-disabled': disabled ? 'true' : 'false',
      onclick: function () {
        if (disabled) { toast(why); return; }
        startRun(key);
      },
    }, [
      el('span', { class: 'mode__top' }, [
        el('span', { class: 'mode__no', text: info.no }),
        el('span', { class: 'mode__badge', text: disabled ? why : info.badge }),
      ]),
      el('span', { class: 'mode__title', text: info.name }),
      el('span', { class: 'mode__desc', text: info.desc }),
      el('span', { class: 'mode__go', text: disabled ? '暂不可用' : info.go }),
    ]);
    card.style.animationDelay = (index * 0.04).toFixed(2) + 's';
    return card;
  }

  /* ---------- 答题 ---------- */
  function startRun(mode) {
    const deck = state.deck;
    if (!deck || !deck.size) { toast('题库是空的，先检查数据文件。'); return; }
    if (mode === 'polar') {
      if (!deck.size) return;
    } else if (mode === 'chain') {
      if (deck.size < 5 || !deck.startable.length) { toast('接龙至少需要 5 条成语，且首尾能接上。'); return; }
    } else if (deck.size < 4) {
      toast('题库至少需要 4 条成语。');
      return;
    }
    let pool = null;
    let total = 10;
    if (mode === 'wrong') {
      pool = wrongWords();
      if (!pool.length) { toast('错题本是空的，先去练几轮。'); return; }
      total = Math.min(10, pool.length);
    } else if (mode === 'chain' || mode === 'polar') {
      total = null;
    }
    state.run = {
      mode: mode,
      total: total,
      answered: 0,
      correct: 0,
      wrong: 0,
      streak: 0,
      best: 0,
      score: 0,
      startedAt: Date.now(),
      elapsedMs: 0,
      qShownAt: Date.now(),
      round: [],
      newWords: [],
      pool: pool,
      q: null,
      chosen: null,
      lastOk: null,
      chainFrom: null,
      deadline: mode === 'polar' ? Date.now() + 60000 : 0,
      finished: false,
    };
    let kind = mode;
    if (mode === 'wrong') kind = Math.random() < 0.5 ? 'cloze' : 'meaning';
    let q = createQuestion(kind, null);
    if (!q && mode === 'wrong') q = createQuestion('meaning', null);
    if (!q) {
      state.run = null;
      toast('没能生成题目，题库可能不足。');
      return;
    }
    state.run.q = q;
    state.resume = null;
    saveRun();
    paintQuiz();
    if (mode === 'polar') startTimer();
  }

  function wrongWords() {
    return state.progress.wrong.filter(function (w) { return state.deck.byW.has(w); });
  }

  function createQuestion(kind, fromW) {
    const run = state.run;
    if (!run) return null;
    const exclude = new Set();
    for (let i = 0; i < run.round.length; i += 1) exclude.add(run.round[i].w);
    const opts = { exclude: exclude };
    if (run.mode === 'wrong' && run.pool && run.pool.length) {
      opts.pool = run.pool.map(function (w) { return state.deck.byW.get(w); }).filter(Boolean);
    }
    if (kind === KIND.CHAIN) {
      opts.from = fromW || null;
      return makeQuestion(KIND.CHAIN, state.deck, opts);
    }
    let q = makeQuestion(kind, state.deck, opts);
    if (!q && kind === KIND.CLOZE) q = makeQuestion(KIND.MEANING, state.deck, opts);
    if (!q) {
      const retry = { pool: opts.pool };
      q = makeQuestion(kind, state.deck, retry);
      if (!q) q = makeQuestion(KIND.MEANING, state.deck, retry);
    }
    return q;
  }

  function answer(choice) {
    if (busy) return;
    const run = state.run;
    if (!run || run.finished || state.view !== 'quiz' || run.chosen !== null) return;
    const q = run.q;
    if (!q || !Number.isInteger(choice) || choice < 0 || choice >= q.options.length) return;

    busy = true;
    const ok = choice === q.answer;
    const now = Date.now();
    run.chosen = choice;
    run.lastOk = ok;
    run.answered += 1;
    if (run.qShownAt) {
      run.elapsedMs += Math.max(0, now - run.qShownAt);
      run.qShownAt = 0;
    }
    if (ok) run.correct += 1;
    else run.wrong += 1;

    if (run.mode === 'chain') {
      if (ok) {
        run.streak += 1;
        if (run.streak > run.best) run.best = run.streak;
        run.score += run.streak;
      } else {
        run.streak = 0;
      }
    } else if (run.mode === 'polar') {
      run.score += ok ? 1 : -1;
    }

    const rec = recordAnswer(state.progress, q.target, ok, now);
    if (rec.isNew && run.newWords.indexOf(q.target) === -1) run.newWords.push(q.target);
    run.round.push({ w: q.target, ok: ok });

    const it = state.deck.byW.get(q.target);
    const chosen = q.options[choice];
    if (ok) {
      announce('答对了。' + (it ? '正确答案：' + it.w + '。' + it.m : ''));
    } else {
      const chosenIt = q.kind === KIND.POLAR ? null : state.deck.byW.get(chosen);
      announce('答错了。正确答案：' + (it ? it.w : '') + '。' +
        (chosenIt ? '你选的是' + chosenIt.w + '，意思是' + chosenIt.m : ''));
    }

    saveProgress();
    saveRun();
    busy = false;
    if (rec.cleared) toast('「' + q.target + '」已移出错题本。');
    paintQuiz({ scroll: 'feedback' });
  }

  function isRoundOver() {
    const run = state.run;
    if (!run || run.chosen === null) return false;
    if (run.mode === 'chain') return !run.lastOk;
    if (run.mode === 'polar') return Date.now() >= run.deadline;
    return run.answered >= run.total;
  }

  function nextStep() {
    if (busy) return;
    const run = state.run;
    if (!run || run.chosen === null || run.finished) return;
    busy = true;
    if (run.mode === 'chain' && !run.lastOk) {
      busy = false;
      finishRun('fail');
      return;
    }
    if (run.mode === 'polar') {
      if (Date.now() >= run.deadline) { busy = false; finishRun('time'); return; }
    } else if (run.mode !== 'chain' && run.answered >= run.total) {
      busy = false;
      finishRun('done');
      return;
    }

    run.chosen = null;
    run.lastOk = null;
    let kind = run.mode;
    if (run.mode === 'wrong') kind = Math.random() < 0.5 ? 'cloze' : 'meaning';
    const fromW = run.mode === 'chain' ? run.q.target : null;
    const q = createQuestion(kind, fromW);
    if (!q) {
      busy = false;
      finishRun('empty');
      return;
    }
    run.q = q;
    run.chainFrom = fromW;
    run.qShownAt = Date.now();
    saveRun();
    busy = false;
    paintQuiz();
  }

  function paintQuiz(opts) {
    state.view = 'quiz';
    const run = state.run;
    if (!run) { paintHome(); return; }
    const q = run.q;
    const it = state.deck.byW.get(q.target);
    if (!it) { finishRun('empty'); return; }
    const answered = run.chosen !== null;
    const info = MODE_INFO[run.mode] || MODE_INFO.meaning;

    const page = el('div', { class: 'quiz-page' });
    page.appendChild(hudNode());
    const panel = el('section', { class: 'panel quiz' });

    const left = el('div', { class: 'qhead__left' }, [
      tag(info.name, 'tag--dim'),
      el('span', { class: 'hint' }, [info.badge]),
    ]);
    panel.appendChild(el('div', { class: 'qhead' }, [
      left,
      el('button', {
        class: 'linkish qexit', type: 'button',
        onclick: exitQuiz,
      }, '退出本轮'),
    ]));

    panel.appendChild(promptNode(run, it));

    const options = el('div', { class: 'opts', role: 'group', 'aria-label': '选项' });
    q.options.forEach(function (label, i) {
      const isRight = answered && i === q.answer;
      const isWrong = answered && i === run.chosen && i !== q.answer;
      let cls = 'opt';
      if (isRight) cls += ' is-right';
      else if (isWrong) cls += ' is-wrong';
      else if (answered) cls += ' is-muted';
      const plain = q.kind === KIND.POLAR;
      const opt = el('button', {
        class: cls, type: 'button',
        'aria-label': '选项 ' + (i + 1) + '：' + label,
        onclick: function () { answer(i); },
      }, [
        el('span', { class: 'opt__no num', text: String(i + 1) }),
        el('span', { class: 'opt__t' + (plain ? ' opt__t--plain' : ''), text: label }),
        el('span', { class: 'opt__mark', 'aria-hidden': 'true', text: isRight ? '✓' : isWrong ? '✕' : '' }),
      ]);
      if (answered) opt.disabled = true;
      options.appendChild(opt);
    });
    panel.appendChild(options);

    if (answered) {
      panel.appendChild(feedbackNode(run, it));
    } else {
      panel.appendChild(el('div', { class: 'qfoot' }, [
        el('span', { class: 'hint' }, [
          '按 ', el('span', { class: 'kbd num', text: '1' }), ' – ',
          el('span', { class: 'kbd num', text: String(q.options.length) }),
          ' 选择，',
          '答完 ', el('span', { class: 'kbd', text: 'Enter' }), ' 下一题',
        ]),
        el('button', { class: 'linkish', type: 'button', onclick: leaveToCards }, '不会？先看学习卡'),
      ]));
    }

    page.appendChild(panel);
    mount(page, opts);
    if (run.mode === 'polar') updateTimerUI();
  }

  function hudNode() {
    const run = state.run;
    const info = MODE_INFO[run.mode] || MODE_INFO.meaning;
    let text = '';
    let pct = 0;
    let min = 0;
    let max = 1;
    let now = 0;
    if (run.mode === 'polar') {
      const remain = Math.max(0, run.deadline - Date.now());
      text = '剩 ' + Math.ceil(remain / 1000) + ' 秒 · 得分 ' + run.score;
      pct = (remain / 60000) * 100;
      min = 0; max = 60; now = Math.ceil(remain / 1000);
    } else if (run.mode === 'chain') {
      text = '连击 ' + run.streak + ' · 得分 ' + run.score;
      pct = Math.min(100, run.streak * 10);
      min = 0; max = 10; now = Math.min(10, run.streak);
    } else {
      const n = Math.min(run.answered + (run.chosen === null ? 1 : 0), run.total);
      text = '第 ' + n + ' / ' + run.total + ' 题';
      pct = run.total ? (run.answered / run.total) * 100 : 0;
      min = 0; max = run.total; now = run.answered;
    }

    const stats = [];
    if (run.mode === 'polar') {
      stats.push(['已答', run.answered]);
      stats.push(['命中率', (run.answered ? Math.round((run.correct / run.answered) * 100) : 0) + '%']);
      stats.push(['答错', run.wrong]);
    } else if (run.mode === 'chain') {
      stats.push(['最长连击', run.best]);
      stats.push(['已答', run.answered]);
    } else {
      stats.push(['答对', run.correct]);
      stats.push(['答错', run.wrong]);
      stats.push(['题库', state.deck.size]);
    }
    const statsNode = el('div', { class: 'hud__stats' }, stats.map(function (pair) {
      return el('span', {}, [pair[0] + ' ', el('b', { text: String(pair[1]) })]);
    }));

    return el('section', { class: 'hud', 'aria-label': '本轮进度' }, [
      el('div', { class: 'hud__row' }, [
        el('span', { class: 'hud__k', text: info.name }),
        el('span', { class: 'hud__v num', id: 'hudRight', text: text }),
      ]),
      el('div', {
        class: 'meter', id: 'hudMeter', role: 'progressbar',
        'aria-valuemin': String(min), 'aria-valuemax': String(max), 'aria-valuenow': String(now),
        'aria-label': '本轮进度',
      }, el('i', { id: 'hudBar', style: { width: pct.toFixed(2) + '%' } })),
      statsNode,
    ]);
  }

  function promptNode(run, it) {
    const q = run.q;
    if (q.kind === KIND.MEANING) {
      return el('div', { class: 'qprompt' }, [
        el('div', { class: 'q-label', text: '释义 · 猜成语' }),
        el('p', { class: 'q-m', text: it.m }),
      ]);
    }
    if (q.kind === KIND.CLOZE) {
      const sentence = it.hasExample ? it.e.split(it.w).join('＿＿＿＿') : '（这条成语暂时没有例句）';
      const node = el('div', { class: 'qprompt' }, [
        el('div', { class: 'q-label', text: '语境 · 填词' }),
      ]);
      const p = el('p', { class: 'q-e' });
      const parts = sentence.split('＿＿＿＿');
      for (let i = 0; i < parts.length; i += 1) {
        if (i > 0) p.appendChild(el('span', { class: 'blank', text: '＿＿＿＿' }));
        if (parts[i]) p.appendChild(document.createTextNode(parts[i]));
      }
      node.appendChild(p);
      return node;
    }
    if (q.kind === KIND.CHAIN) {
      const fromIt = state.deck.byW.get(q.from);
      const wordNode = el('div', { class: 'chain__word' });
      const chars = Array.from(q.from || '');
      chars.forEach(function (c, i) {
        if (i === chars.length - 1) wordNode.appendChild(el('i', { text: c }));
        else wordNode.appendChild(document.createTextNode(c));
      });
      const kids = [
        el('div', { class: 'q-label', text: '接龙 · 第 ' + (run.answered + (run.chosen === null ? 1 : 0)) + ' 环' }),
        el('div', { class: 'chain' }, [
          wordNode,
          el('div', { class: 'chain__arrow', text: '↓' }),
          el('div', { class: 'chain__hint', text: '下一句要以「' + q.required + '」开头' }),
          q.restarted ? el('div', { class: 'chain__note', text: '上一条接不下去，已自动换一条起始成语。' }) : null,
        ]),
      ];
      if (fromIt) kids.push(el('p', { class: 'hint', text: '当前成语：' + fromIt.w + ' · ' + fromIt.m }));
      return el('div', { class: 'qprompt' }, kids);
    }
    return el('div', { class: 'qprompt' }, [
      el('div', { class: 'q-label', text: '感情色彩 · 快判' }),
      el('div', { class: 'polar' }, [
        el('div', { class: 'polar__word', text: it.w }),
        el('div', { class: 'polar__ask', text: '这条成语是褒义、贬义，还是中性？' }),
      ]),
    ]);
  }

  function feedbackNode(run, it) {
    const ok = run.lastOk === true;
    const q = run.q;
    const chosen = q.options[run.chosen];
    const fb = el('div', { class: 'fb ' + (ok ? 'fb--ok' : 'fb--no') });

    const verdict = el('div', { class: 'fb__verdict' }, [
      el('span', { class: 'fb__icon', 'aria-hidden': 'true', text: ok ? '✓' : '✕' }),
      el('span', { text: ok ? '答对了' : '答错了 · 正确答案是「' + it.w + '」' }),
    ]);
    if (run.mode === 'chain') {
      verdict.appendChild(el('span', {
        class: 'fb__combo',
        text: ok ? '连击 ' + run.streak + ' · 得分 ' + run.score : '本轮结束',
      }));
    } else if (run.mode === 'polar') {
      verdict.appendChild(el('span', { class: 'fb__combo', text: (ok ? '+1' : '−1') + ' · 当前 ' + run.score }));
    }
    fb.appendChild(verdict);

    const word = el('div', { class: 'word' }, [
      el('span', { class: 'word__w', text: it.w }),
      idiomTags(it, true),
    ]);
    if (state.progress.seen[it.w] && state.progress.seen[it.w].r >= 2 && state.progress.seen[it.w].w <= 1) {
      word.appendChild(tag('已掌握', 'tag--jade'));
    }
    fb.appendChild(word);
    fb.appendChild(el('p', { class: 'fb__m', text: it.m }));
    if (it.e) fb.appendChild(exampleNode(it));
    if (it.y) {
      fb.appendChild(el('p', { class: 'fb__y', text: '易错字 · ' + it.y + '：写的时候留意这一笔。' }));
    }
    if (q.kind === KIND.CHAIN) {
      fb.appendChild(el('p', {
        class: 'fb__link',
        text: '接龙：「' + q.from + '」末字「' + q.required + '」→「' + it.w + '」首字「' + firstChar(it.w) + '」',
      }));
    }

    if (!ok) {
      const cmp = el('div', { class: 'fb__cmp' });
      if (q.kind === KIND.POLAR) {
        cmp.appendChild(el('p', {}, [
          '你选的是「', el('b', { text: chosen }), '」，这条是「', el('b', { text: it.k }), '」。',
        ]));
      } else {
        const chosenIt = state.deck.byW.get(chosen);
        if (chosenIt && chosenIt.w !== it.w) {
          cmp.appendChild(el('p', {}, [
            '你选的是「', el('b', { text: chosenIt.w }), '」：', chosenIt.m,
          ]));
        }
        if (q.kind === KIND.CHAIN) {
          cmp.appendChild(el('p', {
            text: '「' + q.from + '」的末字是「' + q.required + '」，所以要接一个以「' + q.required + '」开头的成语。',
          }));
        }
      }
      fb.appendChild(cmp);
    }

    const last = isRoundOver();
    const acts = el('div', { class: 'fb__acts' });
    let primaryText = '下一题';
    if (run.mode === 'chain' && !ok) primaryText = '本轮结束 · 看结算';
    else if (last) primaryText = '看结算';
    acts.appendChild(el('button', {
      class: 'btn', type: 'button', onclick: nextStep,
    }, primaryText));
    acts.appendChild(el('button', {
      class: 'btn btn--ghost', type: 'button', onclick: leaveToCards,
    }, '查看学习卡'));
    if (run.mode === 'polar') {
      acts.appendChild(el('span', { class: 'hint', text: '计时不停，答完就下一题' }));
    } else {
      acts.appendChild(el('span', { class: 'hint' }, [
        el('span', { class: 'kbd', text: 'Enter' }), ' 继续',
      ]));
    }
    fb.appendChild(acts);
    return fb;
  }

  function exitQuiz() {
    saveRun();
    paintHome();
    toast('已暂停，本轮进度留着。');
  }

  function leaveToCards() {
    if (state.run) saveRun();
    paintCards();
  }

  function resumeRun() {
    const run = state.resume;
    if (!run) { paintHome(); return; }
    state.resume = null;
    state.run = run;
    if (run.mode === 'polar') {
      if (Date.now() >= run.deadline) { finishRun('time'); return; }
    }
    paintQuiz();
    if (run.mode === 'polar') startTimer();
  }

  /* ---------- 计时（褒贬快判） ---------- */
  function stopTimer() {
    if (timerId) {
      clearInterval(timerId);
      timerId = 0;
    }
  }

  function startTimer() {
    stopTimer();
    if (!state.run || state.run.mode !== 'polar') return;
    updateTimerUI();
    timerId = setInterval(function () {
      if (!state.run || state.run.finished || state.view !== 'quiz') {
        stopTimer();
        return;
      }
      if (Date.now() >= state.run.deadline) {
        updateTimerUI();
        finishRun('time');
        return;
      }
      updateTimerUI();
    }, 200);
  }

  function updateTimerUI() {
    const run = state.run;
    if (!run || run.mode !== 'polar') return;
    const remain = Math.max(0, run.deadline - Date.now());
    const right = document.getElementById('hudRight');
    if (right) right.textContent = '剩 ' + Math.ceil(remain / 1000) + ' 秒 · 得分 ' + run.score;
    const bar = document.getElementById('hudBar');
    if (bar) bar.style.width = ((remain / 60000) * 100).toFixed(2) + '%';
    const meter = document.getElementById('hudMeter');
    if (meter) meter.setAttribute('aria-valuenow', String(Math.ceil(remain / 1000)));
  }

  /* ---------- 结算 ---------- */
  function finishRun(reason) {
    const run = state.run;
    if (!run || run.finished) return;
    run.finished = true;
    stopTimer();
    if (run.chosen === null && run.qShownAt) {
      run.elapsedMs += Math.max(0, Date.now() - run.qShownAt);
      run.qShownAt = 0;
    }
    const timeMs = run.mode === 'polar' ? 60000 : run.elapsedMs;
    const words = unique(run.round.map(function (r) { return r.w; })).filter(function (w) {
      return state.deck.byW.has(w);
    });
    state.summary = {
      mode: run.mode,
      correct: run.correct,
      wrong: run.wrong,
      answered: run.answered,
      newWords: run.newWords.filter(function (w) { return state.deck.byW.has(w); }),
      words: words,
      timeMs: timeMs,
      score: run.score,
      best: run.best,
      streak: run.streak,
      reason: reason,
    };
    state.run = null;
    state.resume = null;
    store.del('idiom.run');
    saveProgress();
    paintResult();
  }

  function paintResult() {
    state.view = 'result';
    stopTimer();
    const s = state.summary;
    if (!s) { paintHome(); return; }
    const info = MODE_INFO[s.mode] || MODE_INFO.meaning;
    const stats = statsOf(state.progress);
    const root = el('div', { class: 'result-page' });

    let big;
    if (s.mode === 'polar') {
      const hit = s.answered ? Math.round((s.correct / s.answered) * 100) : 0;
      big = el('div', { class: 'result__big' }, [String(hit) + '%', el('small', { text: '命中率' })]);
    } else if (s.mode === 'chain') {
      big = el('div', { class: 'result__big' }, [String(s.best), el('small', { text: '最长连击' })]);
    } else {
      big = el('div', { class: 'result__big' }, [
        String(s.correct), el('small', { text: '/ ' + s.answered + ' 题答对' }),
      ]);
    }

    let title = '';
    if (s.reason === 'empty') title = '题库里没有可出的题了。';
    else if (s.mode === 'polar') title = '六十秒到，收手。';
    else if (s.mode === 'chain') title = s.reason === 'fail' ? '接不上了，到此为止。' : '这一轮接完了。';
    else {
      const rate = s.answered ? s.correct / s.answered : 0;
      if (rate >= 0.8) title = '记得很牢，继续保持。';
      else if (rate >= 0.5) title = '有印象了，再走一轮就稳。';
      else title = '这几条，正好现在记住。';
    }

    const metrics = [
      metric(fmtTime(s.timeMs), '用时'),
      metric(s.answered ? Math.round((s.correct / s.answered) * 100) + '%' : '—', '正确率'),
      metric(String(s.newWords.length), '本轮新学'),
    ];
    if (s.mode === 'chain' || s.mode === 'polar') metrics.push(metric(String(s.score), '得分'));

    root.appendChild(el('section', { class: 'panel' }, [
      el('div', { class: 'result__head' }, [
        el('div', { class: 'eyebrow', text: info.name + ' · 本轮结算' }),
        big,
        el('h1', { class: 'result__title', text: title }),
        el('div', { class: 'metrics' }, metrics),
        el('div', { class: 'cum' }, [
          el('span', { class: 'chip', text: '累计' }),
          statChip('已学', stats.learned),
          statChip('掌握', stats.mastered),
          statChip('错题', stats.wrong),
        ]),
      ]),
      el('hr', { class: 'rule' }),
      el('div', { class: 'result__section' }, [
        el('div', { class: 'section-head' }, [
          el('h2', { text: s.newWords.length ? '本轮新学 · ' + s.newWords.length + ' 条' : '本轮练过 · ' + s.words.length + ' 条', }),
          el('span', { text: s.newWords.length ? 'NEW WORDS' : 'REVIEW' }),
        ]),
        s.newWords.length || s.words.length
          ? el('div', { class: 'learnlist' }, (s.newWords.length ? s.newWords : s.words).map(function (w) {
            return learnRow(state.deck.byW.get(w));
          }))
          : el('p', { class: 'dim', text: '这一轮没有记下新的成语——下次可以试试别的模式。' }),
      ]),
      el('div', { class: 'result__acts' }, [
        el('button', {
          class: 'btn', type: 'button',
          onclick: function () { startRun(s.mode); },
        }, s.mode === 'wrong' ? '再练一轮错题' : '再来一轮'),
        el('button', { class: 'btn btn--ghost', type: 'button', onclick: paintHome }, '换一道关'),
        el('button', { class: 'btn btn--ghost', type: 'button', onclick: paintCards }, '学习卡'),
        stats.wrong ? el('button', { class: 'btn btn--ghost', type: 'button', onclick: paintWrong }, '错题本') : null,
      ]),
      el('p', { class: 'result__fine', text: '进度已存到本机浏览器；换设备不会同步。' }),
    ]));

    mount(root);
    announce('本轮结束。' + title);
  }

  function learnRow(it) {
    if (!it) return null;
    uid += 1;
    const bodyId = 'learn-body-' + uid;
    const row = el('div', { class: 'lrow' });
    const body = el('div', { class: 'lrow__body', id: bodyId, hidden: true }, [
      it.e ? exampleNode(it) : el('p', { class: 'dim', text: '（暂无例句）' }),
      it.y ? el('p', { class: 'fb__y', text: '易错字 · ' + it.y }) : null,
    ]);
    const btn = el('button', {
      class: 'lrow__btn', type: 'button',
      'aria-expanded': 'false', 'aria-controls': bodyId,
      onclick: function () {
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        body.hidden = open;
        row.classList.toggle('is-open', !open);
      },
    }, [
      el('span', { class: 'lrow__w', text: it.w }),
      polarTag(it.k),
      el('span', { class: 'lrow__m', text: it.m }),
      el('span', { class: 'lrow__chan', 'aria-hidden': 'true', text: '⌄' }),
    ]);
    row.appendChild(btn);
    row.appendChild(body);
    return row;
  }

  /* ---------- 学习卡 ---------- */
  function paintCards() {
    state.view = 'cards';
    stopTimer();
    if (state.run) saveRun();
    const stats = statsOf(state.progress);
    const root = el('div', { class: 'cards-page' });

    root.appendChild(el('div', { class: 'cards-head' }, [
      el('div', {}, [
        el('div', { class: 'eyebrow', text: '学习卡 · 全部成语' }),
        el('h1', { text: '一条一条过。' }),
        el('p', { class: 'dim', text: '共 ' + state.deck.size + ' 条 · 当前已学 ' + stats.learned + ' 条 · 点开可看释义与例句' }),
      ]),
      el('div', { class: 'cards-head__act' }, [
        state.run ? el('button', { class: 'btn', type: 'button', onclick: resumeQuiz }, '回到本轮') : null,
        el('button', { class: 'back', type: 'button', onclick: paintHome }, '← 回首页'),
      ]),
    ]));

    const panel = el('section', { class: 'panel cards-panel' });
    const listHost = el('div', { class: 'clist' });
    const countHost = el('div', { class: 'count-line' });
    const pagerHost = el('div', { class: 'pager' });

    const searchInput = el('input', {
      type: 'search', value: state.cards.q,
      placeholder: '搜成语、释义、例句关键词…', 'aria-label': '搜索成语',
      oninput: function () {
        state.cards.q = searchInput.value;
        state.cards.page = 1;
        renderList();
      },
    });

    const groups = Array.from(state.deck.byGroup.keys()).sort();
    const groupSel = el('select', {
      'aria-label': '按类别筛选',
      onchange: function () {
        state.cards.group = groupSel.value;
        state.cards.page = 1;
        renderList();
      },
    }, [el('option', { value: '' }, '全部类别')].concat(groups.map(function (g) {
      return el('option', { value: g }, g);
    })));
    groupSel.value = state.cards.group;

    const polarSel = el('select', {
      'aria-label': '按感情色彩筛选',
      onchange: function () {
        state.cards.polar = polarSel.value;
        state.cards.page = 1;
        renderList();
      },
    }, [
      el('option', { value: '' }, '全部感情色彩'),
      el('option', { value: '褒义' }, '褒义'),
      el('option', { value: '贬义' }, '贬义'),
      el('option', { value: '中性' }, '中性'),
    ]);
    polarSel.value = state.cards.polar;

    panel.appendChild(el('div', { class: 'toolbar' }, [
      el('div', { class: 'search' }, searchInput),
      el('div', { class: 'filters' }, [groupSel, polarSel]),
    ]));
    panel.appendChild(countHost);
    panel.appendChild(listHost);
    panel.appendChild(pagerHost);
    root.appendChild(panel);

    function filtered() {
      let arr = state.deck.list;
      const g = state.cards.group;
      const k = state.cards.polar;
      if (g) arr = arr.filter(function (x) { return x.g === g; });
      if (k) arr = arr.filter(function (x) { return x.k === k; });
      const q = state.cards.q.trim();
      if (q) {
        const terms = q.split(/\s+/).filter(Boolean);
        arr = arr.filter(function (x) {
          return terms.every(function (t) {
            return x.w.indexOf(t) !== -1 || x.m.indexOf(t) !== -1 ||
              (x.e && x.e.indexOf(t) !== -1) || (x.y && t === x.y);
          });
        });
      }
      return arr;
    }

    function renderList(jump) {
      const list = filtered();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (state.cards.page > pages) state.cards.page = pages;
      if (state.cards.page < 1) state.cards.page = 1;
      const page = state.cards.page;
      const start = (page - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      const filteredOn = !!(state.cards.q || state.cards.group || state.cards.polar);

      const from = list.length ? start + 1 : 0;
      const to = Math.min(list.length, start + PAGE_SIZE);
      const countKids = [
        el('span', { text: '共 ' + list.length + ' 条' + (filteredOn ? ' · 已筛选' : '') + ' · 显示 ' + from + '–' + to }),
      ];
      if (filteredOn) {
        countKids.push(el('button', {
          class: 'linkish', type: 'button',
          onclick: function () {
            state.cards.q = '';
            state.cards.group = '';
            state.cards.polar = '';
            state.cards.page = 1;
            paintCards();
          },
        }, '清除筛选'));
      }
      countHost.replaceChildren.apply(countHost, countKids);

      if (!slice.length) {
        listHost.replaceChildren(filteredOn
          ? emptyPanel('空', '没有匹配的成语', '换个关键词，或把类别、感情色彩调回“全部”再试。', null, true)
          : emptyPanel('空', '题库里还没有成语', '等 data/idioms.js 写入数据后刷新页面即可。', null, true));
      } else {
        listHost.replaceChildren.apply(listHost, slice.map(cardRow));
      }

      const kids = [];
      kids.push(el('button', {
        class: 'pager__btn', type: 'button', disabled: page <= 1,
        'aria-label': '上一页',
        onclick: function () { state.cards.page = page - 1; renderList(true); },
      }, '‹'));
      pageWindow(page, pages).forEach(function (p) {
        if (p === '…') { kids.push(el('span', { class: 'pager__dots', text: '…' })); return; }
        kids.push(el('button', {
          class: 'pager__btn' + (p === page ? ' is-on' : ''),
          type: 'button', text: String(p),
          'aria-label': '第 ' + p + ' 页',
          'aria-current': p === page ? 'page' : null,
          onclick: function () { state.cards.page = p; renderList(true); },
        }));
      });
      kids.push(el('button', {
        class: 'pager__btn', type: 'button', disabled: page >= pages,
        'aria-label': '下一页',
        onclick: function () { state.cards.page = page + 1; renderList(true); },
      }, '›'));
      kids.push(el('span', { class: 'pager__info', text: page + ' / ' + pages + ' 页' }));
      pagerHost.replaceChildren.apply(pagerHost, kids);

      if (jump) {
        try { panel.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
        catch (err) { panel.scrollIntoView(); }
      }
    }

    mount(root);
    renderList();
  }

  function resumeQuiz() {
    if (!state.run) { paintHome(); return; }
    state.view = 'quiz';
    if (state.run.mode === 'polar') {
      if (Date.now() >= state.run.deadline) { finishRun('time'); return; }
    }
    paintQuiz();
    if (state.run && state.run.mode === 'polar') startTimer();
  }

  function pageWindow(current, pages) {
    if (pages <= 7) {
      const arr = [];
      for (let i = 1; i <= pages; i += 1) arr.push(i);
      return arr;
    }
    const set = new Set([1, pages, current - 1, current, current + 1]);
    const arr = Array.from(set).filter(function (p) { return p >= 1 && p <= pages; }).sort(function (a, b) { return a - b; });
    const out = [];
    for (let i = 0; i < arr.length; i += 1) {
      if (i > 0 && arr[i] - arr[i - 1] > 1) out.push('…');
      out.push(arr[i]);
    }
    return out;
  }

  function cardRow(it) {
    const rec = state.progress.seen[it.w];
    const stat = rec
      ? el('span', { class: 'crow__stat' }, ['对 ', el('b', { text: String(rec.r) }), ' · 错 ', el('b', { text: String(rec.w) })])
      : el('span', { class: 'crow__stat', text: '未学' });
    return el('button', {
      class: 'crow', type: 'button',
      'aria-label': '查看成语 ' + it.w,
      onclick: function () { openIdiomDetail(it.w); },
    }, [
      el('span', { class: 'crow__w', text: it.w }),
      el('span', { class: 'crow__mid' }, [
        el('span', { class: 'crow__m', text: it.m }),
        el('span', { class: 'crow__tags' }, [polarTag(it.k), tag(it.g, 'tag--dim')]),
      ]),
      stat,
    ]);
  }

  /* ---------- 错题本 ---------- */
  function paintWrong() {
    state.view = 'wrong';
    stopTimer();
    if (state.run) saveRun();
    const items = state.progress.wrong.map(function (w) {
      return { it: state.deck.byW.get(w), rec: state.progress.seen[w] };
    }).filter(function (x) { return x.it && x.rec; }).sort(function (a, b) {
      return (b.rec.w - a.rec.w) || (b.rec.t - a.rec.t);
    });

    const root = el('div', { class: 'wrong-page' });
    root.appendChild(el('div', { class: 'cards-head' }, [
      el('div', {}, [
        el('div', { class: 'eyebrow', text: '错题本 · 只练错的' }),
        el('h1', { text: '把错的，练回来。' }),
        el('p', { class: 'dim', text: '每条错题答对 2 次才会移出；答错一次重新计数。' }),
      ]),
      el('div', { class: 'cards-head__act' }, [
        state.run ? el('button', { class: 'btn', type: 'button', onclick: resumeQuiz }, '回到本轮') : null,
        el('button', { class: 'back', type: 'button', onclick: paintHome }, '← 回首页'),
      ]),
    ]));

    const panel = el('section', { class: 'panel wrong-panel' });
    if (!items.length) {
      panel.appendChild(emptyPanel('净', '错题本是空的', '要么你还没做错过题，要么已经全部清出去了。先去随便练一轮吧。', el('button', {
        class: 'btn btn--ghost', type: 'button', onclick: paintHome,
      }, '去选一道关')));
    } else {
      panel.appendChild(el('div', { class: 'wrong-head' }, [
        el('span', { class: 'wrong-head__count', text: '共 ' + items.length + ' 条 · 按错误次数从多到少' }),
        el('button', {
          class: 'btn', type: 'button',
          onclick: function () { startRun('wrong'); },
        }, '开始练错题（' + Math.min(10, items.length) + ' 题）'),
      ]));
      const list = el('div', { class: 'wrong-list' });
      items.forEach(function (x, i) {
        const f = x.rec.f || 0;
        const need = Math.max(0, 2 - f);
        list.appendChild(el('button', {
          class: 'wrow', type: 'button',
          'aria-label': '查看成语 ' + x.it.w,
          onclick: function () { openIdiomDetail(x.it.w); },
        }, [
          el('span', { class: 'wrow__rank num', text: String(i + 1).padStart(2, '0') }),
          el('span', { class: 'wrow__w', text: x.it.w }),
          el('span', { class: 'wrow__meta' }, [
            '错 ', el('b', { text: String(x.rec.w) }), ' · 对 ', el('b', { text: String(x.rec.r) }),
            ' · 上次 ' + fmtDate(x.rec.t),
          ]),
          el('span', { class: 'wrow__need', text: need ? '再答对 ' + need + ' 次移出' : '即将移出' }),
        ]));
      });
      panel.appendChild(list);
    }
    root.appendChild(panel);
    mount(root);
  }

  /* ---------- 弹层：详情 / 清空确认 ---------- */
  function closeOverlay(silent) {
    if (!overlayEl) return;
    const ret = overlayReturn;
    overlayEl.remove();
    overlayEl = null;
    document.body.style.overflow = overlayPrevOverflow || '';
    overlayPrevOverflow = '';
    overlayReturn = null;
    if (!silent && ret && ret.isConnected && typeof ret.focus === 'function') ret.focus();
  }

  function openOverlay(opt) {
    closeOverlay(true);
    overlayReturn = document.activeElement;
    overlayPrevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    const closeBtn = el('button', {
      class: 'overlay__close', type: 'button', 'aria-label': '关闭',
      onclick: function () { closeOverlay(); },
    }, '×');

    const panel = el('div', {
      class: 'panel overlay__panel', role: 'dialog', 'aria-modal': 'true',
      'aria-labelledby': 'overlay-title',
    }, [
      closeBtn,
      el('div', { class: 'overlay__head' }, [
        opt.eyebrow ? el('div', { class: 'eyebrow', text: opt.eyebrow }) : null,
        el('h2', { id: 'overlay-title', text: opt.title || '' }),
      ]),
      el('div', { class: 'overlay__body' }, opt.body || []),
      opt.actions ? el('div', { class: 'overlay__acts' }, opt.actions) : null,
    ]);

    overlayEl = el('div', {
      class: 'overlay',
      onclick: function (e) { if (e.target === overlayEl) closeOverlay(); },
    }, panel);
    document.body.appendChild(overlayEl);
    closeBtn.focus();
  }

  function openIdiomDetail(word) {
    const it = state.deck.byW.get(word);
    if (!it) return;
    const rec = state.progress.seen[word];
    const learned = !!rec;
    const mastered = !!rec && rec.r >= 2 && rec.w <= 1;
    const f = rec ? (rec.f || 0) : 0;
    const inWrong = state.progress.wrong.indexOf(word) !== -1;

    const body = [
      el('div', { class: 'word' }, [
        el('span', { class: 'word__w', text: it.w }),
        idiomTags(it, true),
      ]),
      el('p', { class: 'detail__m', text: it.m }),
      it.e ? exampleNode(it) : el('p', { class: 'dim', text: '（这条成语暂时没有例句）' }),
      it.y ? el('p', { class: 'fb__y', text: '易错字 · ' + it.y + '：写的时候留意这一笔。' }) : null,
      el('div', { class: 'detail__stats' }, [
        statChip('答对', learned ? rec.r : 0),
        statChip('答错', learned ? rec.w : 0),
        statChip('状态', !learned ? '未学' : mastered ? '已掌握' : '学习中'),
      ]),
      inWrong
        ? el('p', { class: 'detail__hint', text: '在错题本中：再答对 ' + Math.max(0, 2 - f) + ' 次移出。' })
        : el('p', { class: 'detail__hint', text: learned ? '已学过这条。' : '还没在题目里见过这条。' }),
    ];

    openOverlay({
      eyebrow: '学习卡 · ' + it.g,
      title: it.w,
      body: body,
      actions: [
        el('button', { class: 'btn btn--ghost', type: 'button', onclick: function () { closeOverlay(); } }, '关闭'),
      ],
    });
  }

  function confirmClear() {
    const stats = statsOf(state.progress);
    openOverlay({
      eyebrow: '清空进度',
      title: '真的清零？',
      body: [
        el('p', { text: '已学 ' + stats.learned + ' 条、掌握 ' + stats.mastered + ' 条、错题 ' + stats.wrong + ' 条，以及未完成的一轮，都会被清掉。' }),
        el('p', { text: '题库本身不受影响。此操作不可撤销。' }),
      ],
      actions: [
        el('button', { class: 'btn btn--ghost', type: 'button', onclick: function () { closeOverlay(); } }, '取消'),
        el('button', {
          class: 'btn btn--cinnabar', type: 'button',
          onclick: function () {
            store.del('idiom.progress');
            store.del('idiom.run');
            state.progress = emptyProgress();
            state.run = null;
            state.resume = null;
            state.summary = null;
            closeOverlay();
            toast('进度已清空。');
            paintHome();
          },
        }, '确认清空'),
      ],
    });
  }

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (overlayEl) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeOverlay();
        return;
      }
      if (e.key === 'Tab') {
        const focusables = Array.from(overlayEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
          .filter(function (n) { return !n.disabled; });
        if (focusables.length) {
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
      return;
    }
    if (state.view !== 'quiz' || !state.run) return;
    if (state.run.chosen !== null) {
      if (e.key === 'Enter') {
        e.preventDefault();
        nextStep();
      }
      return;
    }
    if (e.key.length === 1) {
      const idx = Number(e.key) - 1;
      if (Number.isInteger(idx) && idx >= 0 && idx < state.run.q.options.length) {
        e.preventDefault();
        answer(idx);
      }
    }
  });

  window.addEventListener('pagehide', function () {
    if (state.run && !state.run.finished) saveRun();
    saveProgress();
  });

  /* ---------- 启动 ---------- */
  const rawData = (typeof window !== 'undefined' && window.IDIOM_DATA) || [];
  state.deck = makeDeck(normalizeData(rawData));
  state.progress = normalizeProgress(
    store.get('idiom.progress', null),
    state.deck.size ? state.deck.list.map(function (x) { return x.w; }) : null
  );

  DSHG.mountChrome({ title: '成语闯关 · 考公', meta: 'IDIOMS · 800+' });
  state.resume = loadRun();
  paintHome();
})();
</script>
</body>
</html>
