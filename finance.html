<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('inkwash.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理财诊室 · 银行从业 · 墨戏五卷</title>
<meta name="description" content="案例式决策训练：一位客户进门，分四步处理——了解客户、定级与事实判断、方案与产品、销售动作与后续。每选一步立刻反馈，走完给总分、评级、逐步复盘与知识要点。纯前端离线可玩。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f16'/%3E%3Cpath d='M14 48V22l10 8 8-14 8 14 10-8v26' fill='none' stroke='%23c9a86a' stroke-width='2'/%3E%3Ccircle cx='44' cy='17' r='4' fill='none' stroke='%23e0604f' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/theme.css">
<style>
  /* ============================================================
     理财诊室 · 页面样式
     只复用 theme.css 的设计令牌与基础组件；版式与业务状态写在这里。
     ============================================================ */

  html, body { overflow-x: hidden; }

  #app { width: min(900px, calc(100% - 40px)); padding: 22px 0 0; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }

  .linkish {
    border: 0; background: none; padding: 0;
    font: inherit; color: var(--gold-bright); cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .linkish:hover { border-bottom-color: var(--gold); }
  button.back {
    border: 0; background: none; padding: 6px 0;
    font-family: var(--font-sans); cursor: pointer;
    justify-self: start;
  }

  .section-head { display: flex; align-items: baseline; gap: 12px; margin: 28px 0 12px; }
  .section-head h2 { margin: 0; font-size: 20px; }
  .section-head span { font-size: 10.5px; letter-spacing: 0.24em; color: var(--text-faint); }

  /* ---------- 数据自检提示条 ---------- */
  .databar {
    display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap;
    margin: 0 0 16px; padding: 10px 14px;
    border: 1px solid rgba(224, 96, 79, 0.32);
    background: rgba(184, 71, 60, 0.08);
    border-radius: 9px;
    font-size: 12.5px; line-height: 1.7; color: var(--text-dim);
  }
  .databar b { color: var(--cinnabar-bright); font-weight: 600; }
  .databar__hint { color: var(--text-faint); font-size: 11px; }

  /* ---------- 首页 ---------- */
  .hero { padding: 6px 0 0; }
  .hero h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 5.4vw, 46px);
    line-height: 1.3;
  }
  .hero h1 em { font-style: normal; color: var(--gold-bright); }
  .hero .lede {
    max-width: 41em; margin: 0 0 8px;
    font-size: 14.5px; line-height: 1.88; color: var(--text-dim);
  }
  .hero__acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .hero__acts .btn { padding: 9px 18px; font-size: 13.5px; }

  .stats {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px; margin: 22px 0 0;
  }
  .stat {
    min-width: 0; padding: 13px 14px 12px;
    border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    background: linear-gradient(160deg, var(--surface), var(--surface-2));
    position: relative; overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, var(--gold), transparent); opacity: 0.65;
  }
  .stat__k { display: block; font-size: 10.5px; letter-spacing: 0.18em; color: var(--text-faint); }
  .stat__v {
    display: block; font-family: var(--font-num);
    font-size: clamp(22px, 5.4vw, 30px); line-height: 1.3;
    color: var(--gold-bright); margin: 2px 0 1px;
    overflow-wrap: anywhere;
  }
  .stat__n { display: block; font-size: 10.5px; line-height: 1.5; color: var(--text-faint); }
  .stat--jade::before { background: linear-gradient(180deg, var(--jade), transparent); }
  .stat--jade .stat__v { color: var(--jade-bright); }
  .stat--cin::before { background: linear-gradient(180deg, var(--cinnabar), transparent); }
  .stat--cin .stat__v { color: var(--cinnabar-bright); }
  .stat--azure::before { background: linear-gradient(180deg, var(--azure), transparent); }
  .stat--azure .stat__v { color: var(--azure); }

  .filters-panel { margin-top: 10px; padding: 18px 20px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .filters select {
    flex: 0 1 150px; min-width: 128px; min-height: 44px;
    padding: 8px 11px;
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line-soft); border-radius: 8px;
  }
  .search { flex: 1 1 220px; position: relative; min-width: 180px; }
  .search input {
    width: 100%; min-height: 44px;
    padding: 9px 13px 9px 40px;
    font-family: inherit; font-size: 13.5px; color: var(--text);
    background: var(--w-01);
    border: 1px solid var(--line-soft); border-radius: 8px;
  }
  .search input::placeholder { color: var(--text-faint); }
  .search input:focus { outline: none; border-color: rgba(201, 168, 106, 0.55); box-shadow: 0 0 0 3px rgba(201, 168, 106, 0.1); }
  .search::before {
    content: "搜"; position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-serif); font-size: 12px; color: var(--gold-dim);
    pointer-events: none;
  }

  .count-line {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    margin: 16px 0 10px; font-size: 11.5px; color: var(--text-faint);
  }
  .count-line .linkish { font-size: 11.5px; color: var(--text-dim); }

  .case-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .case-card {
    display: flex; flex-direction: column; gap: 7px;
    width: 100%; min-height: 152px; padding: 15px 16px 13px;
    text-align: left; font-family: var(--font-sans); color: inherit;
    border: 1px solid var(--line-soft); border-radius: 11px;
    background: linear-gradient(165deg, var(--w-02), var(--w-01));
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .case-card:hover { border-color: var(--line); background: rgba(201, 168, 106, 0.06); transform: translateY(-2px); }
  .case-card:active { transform: translateY(0); }
  .case-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .case-card__title {
    margin: 0; font-family: var(--font-serif); font-size: 18.5px;
    font-weight: 600; line-height: 1.45; letter-spacing: 0.03em; color: var(--text);
  }
  .case-card__client { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--gold); }
  .case-card__goal {
    margin: 0; font-size: 11.8px; line-height: 1.65; color: var(--text-faint);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .case-card__tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .case-card__tags .tag { font-size: 10.5px; padding: 1px 8px; }
  .case-card__foot {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-soft);
    font-size: 11px; color: var(--text-faint);
  }
  .case-card__done { color: var(--jade-bright); }
  .case-card__done b { font-family: var(--font-num); font-size: 14px; font-weight: 400; }
  .case-card__best { color: var(--text-faint); }
  .case-card__go { color: var(--gold); letter-spacing: 0.08em; white-space: nowrap; }

  .lv {
    flex: 0 0 auto; font-size: 10px; letter-spacing: 0.1em;
    padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .lv--1 { color: var(--jade-bright); border-color: rgba(148, 201, 186, 0.42); background: rgba(111, 168, 154, 0.1); }
  .lv--2 { color: var(--gold-bright); border-color: rgba(201, 168, 106, 0.46); background: rgba(201, 168, 106, 0.09); }
  .lv--3 { color: var(--cinnabar-bright); border-color: rgba(224, 96, 79, 0.46); background: rgba(184, 71, 60, 0.1); }

  .home__foot {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-top: 24px;
    font-size: 11.5px; color: var(--text-faint);
  }
  .home__foot .linkish { font-size: 12px; color: var(--text-dim); }
  .home__foot .linkish:hover { color: var(--gold-bright); }

  .pager { display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap; margin-top: 18px; }
  .pager__btn {
    min-width: 36px; min-height: 36px; padding: 5px 10px;
    border: 1px solid var(--line-soft); border-radius: 8px;
    background: none; color: var(--text-dim);
    font-family: var(--font-num); font-size: 12.5px; cursor: pointer;
  }
  .pager__btn:hover:not([disabled]) { border-color: var(--line); color: var(--gold-bright); background: rgba(201, 168, 106, 0.07); }
  .pager__btn[disabled] { opacity: 0.32; cursor: not-allowed; }
  .pager__btn.is-on { border-color: var(--gold); background: var(--gold); color: var(--ink-0); }
  .pager__dots { color: var(--text-faint); font-size: 12px; padding: 0 2px; }
  .pager__info { font-size: 11px; color: var(--text-faint); margin-left: 4px; }

  /* ---------- 案例页 ---------- */
  .case-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .case-head .back { color: var(--text-dim); font-size: 12.5px; letter-spacing: 0.08em; }
  .case-head .back:hover { color: var(--gold-bright); }
  .case-head__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .case-head__title { margin: 0; font-size: clamp(22px, 3.8vw, 30px); line-height: 1.35; }

  .step-hud { display: flex; flex-direction: column; gap: 6px; }
  .step-hud__row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .step-hud__label { font-family: var(--font-serif); font-size: 12.5px; letter-spacing: 0.12em; color: var(--gold); }
  .step-hud__count { font-size: 11.5px; color: var(--text-faint); }
  .step-hud .meter { height: 5px; }

  .client-card {
    position: relative; margin-bottom: 14px; padding: 17px 19px 15px;
    border: 1px solid rgba(201, 168, 106, 0.46);
    border-left: 3px solid var(--gold);
    border-radius: 12px;
    background:
      linear-gradient(150deg, rgba(201, 168, 106, 0.11), rgba(201, 168, 106, 0.028) 58%, var(--surface-2));
    box-shadow: var(--shadow-1);
  }
  .client-card__head { display: flex; align-items: baseline; gap: 9px 11px; flex-wrap: wrap; margin-bottom: 10px; }
  .client-card__kicker { font-size: 10px; letter-spacing: 0.24em; color: var(--gold-dim); }
  .client-card__name { font-family: var(--font-serif); font-size: 21px; line-height: 1.3; letter-spacing: 0.06em; color: var(--text); }
  .client-card__meta { font-size: 12px; color: var(--text-dim); }
  .client-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 18px; margin: 0;
  }
  .client-field { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 13px; line-height: 1.7; }
  .client-field--wide { grid-column: 1 / -1; }
  .client-grid dt { flex: 0 0 2.9em; font-size: 11px; letter-spacing: 0.08em; color: var(--text-faint); }
  .client-grid dd { margin: 0; min-width: 0; color: var(--text); overflow-wrap: anywhere; }
  .client-quote {
    margin: 11px 0 0; padding: 9px 12px;
    border-left: 2px solid var(--line);
    border-radius: 0 8px 8px 0;
    background: var(--surface-2);
    font-family: var(--font-serif); font-size: 13.8px; line-height: 1.85; color: var(--text);
  }
  .client-quote cite {
    display: block; margin-top: 2px;
    font-family: var(--font-sans); font-style: normal;
    font-size: 10px; letter-spacing: 0.16em; color: var(--text-faint);
  }

  .panel.case-q { padding: 22px 24px 20px; }
  .q-label { font-size: 10.5px; letter-spacing: 0.26em; color: var(--gold-dim); margin-bottom: 8px; }
  .q-text {
    margin: 0; font-family: var(--font-serif);
    font-size: clamp(17px, 2.5vw, 20.5px); line-height: 1.85;
    color: var(--text); text-align: justify;
  }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .opt {
    position: relative; display: flex; gap: 12px;
    width: 100%; min-height: 56px; padding: 13px 15px;
    text-align: left; font-family: var(--font-sans); color: var(--text);
    background: var(--w-01);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .opt:hover:not([disabled]) { border-color: var(--line); background: rgba(201, 168, 106, 0.075); transform: translateY(-1px); }
  .opt[disabled] { cursor: default; }
  .opt__no {
    flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 50%;
    font-size: 11.5px; color: var(--gold);
  }
  .opt__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .opt__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .opt__t { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.7; color: var(--text); overflow-wrap: anywhere; }
  .opt__badge {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border: 1px solid; border-radius: 999px;
    font-size: 10.5px; letter-spacing: 0.06em; white-space: nowrap;
  }
  .opt__badge--best { color: var(--jade-bright); border-color: rgba(148, 201, 186, 0.5); background: rgba(111, 168, 154, 0.12); }
  .opt__badge--ok { color: var(--gold-bright); border-color: rgba(201, 168, 106, 0.48); background: rgba(201, 168, 106, 0.1); }
  .opt__badge--bad { color: var(--cinnabar-bright); border-color: rgba(224, 96, 79, 0.5); background: rgba(184, 71, 60, 0.12); }
  .opt__picked {
    align-self: flex-start;
    font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim);
    border: 1px solid var(--line-soft); border-radius: 999px; padding: 0 7px;
  }
  .opt.is-best { border-color: rgba(148, 201, 186, 0.55); background: rgba(111, 168, 154, 0.1); }
  .opt.is-best .opt__no { border-color: var(--jade); color: var(--jade-bright); }
  .opt.is-ok { border-color: rgba(201, 168, 106, 0.46); background: rgba(201, 168, 106, 0.08); }
  .opt.is-ok .opt__no { border-color: var(--gold); color: var(--gold-bright); }
  .opt.is-bad { border-color: rgba(224, 96, 79, 0.5); background: rgba(184, 71, 60, 0.1); }
  .opt.is-bad .opt__no { border-color: var(--cinnabar); color: var(--cinnabar-bright); }
  .opt.is-picked { box-shadow: 0 0 0 2px rgba(230, 226, 216, 0.18); }
  .opt.is-picked.is-best { box-shadow: 0 0 0 2px rgba(148, 201, 186, 0.24); }
  .opt.is-picked.is-ok { box-shadow: 0 0 0 2px rgba(201, 168, 106, 0.22); }
  .opt.is-picked.is-bad { box-shadow: 0 0 0 2px rgba(224, 96, 79, 0.24); }
  .opt.is-muted { opacity: 0.72; }

  .prod { margin-top: 1px; padding-top: 8px; border-top: 1px dashed var(--line-soft); }
  .prod__head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 5px; }
  .prod__name { font-family: var(--font-serif); font-size: 12.5px; letter-spacing: 0.04em; color: var(--gold-bright); }
  .prod__type {
    font-size: 9.5px; letter-spacing: 0.08em; color: var(--text-faint);
    border: 1px solid var(--line-soft); border-radius: 999px; padding: 0 6px;
  }
  .prod__grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2px 14px; font-size: 11.2px; line-height: 1.65; color: var(--text-dim);
  }
  .prod__grid b { margin-right: 4px; font-weight: 400; color: var(--text-faint); font-size: 10.5px; }
  .prod__risk { font-family: var(--font-num); font-style: normal; color: var(--cinnabar-bright); }
  .prod__note { margin: 5px 0 0; font-size: 11px; line-height: 1.65; color: var(--text-faint); }

  .qfoot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-top: 15px;
  }
  .hint { font-size: 11.5px; letter-spacing: 0.03em; color: var(--text-faint); }
  .kbd {
    display: inline-grid; place-items: center;
    min-width: 18px; height: 18px; margin: 0 2px; padding: 0 4px;
    font-family: var(--font-num); font-size: 10.5px; line-height: 1;
    color: var(--text-dim);
    border: 1px solid var(--line-soft); border-radius: 4px;
    background: var(--w-01);
  }

  .fb {
    margin-top: 18px; padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    animation: fadeUp 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    scroll-margin-top: 80px;
  }
  .fb__verdict {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    margin-bottom: 10px;
    font-family: var(--font-serif); font-size: 17px; letter-spacing: 0.04em;
  }
  .fb__icon {
    width: 26px; height: 26px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 50%; border: 1px solid; font-size: 13px; line-height: 1;
  }
  .fb__earn { margin-left: auto; font-family: var(--font-num); font-size: 12px; color: var(--text-faint); }
  .fb--best .fb__verdict { color: var(--jade-bright); }
  .fb--best .fb__icon { color: var(--jade-bright); border-color: rgba(148, 201, 186, 0.5); background: rgba(111, 168, 154, 0.13); }
  .fb--ok .fb__verdict { color: var(--gold-bright); }
  .fb--ok .fb__icon { color: var(--gold-bright); border-color: rgba(201, 168, 106, 0.5); background: rgba(201, 168, 106, 0.13); }
  .fb--bad .fb__verdict { color: var(--cinnabar-bright); }
  .fb--bad .fb__icon { color: var(--cinnabar-bright); border-color: rgba(224, 96, 79, 0.5); background: rgba(184, 71, 60, 0.13); }
  .fb__chosen { margin: 0 0 6px; font-size: 12px; line-height: 1.7; color: var(--text-faint); }
  .fb__text { margin: 0 0 12px; font-size: 14px; line-height: 1.88; color: var(--text); }
  .teach {
    padding: 10px 13px;
    border: 1px solid var(--line); border-radius: 9px;
    background: rgba(201, 168, 106, 0.055);
  }
  .teach__k { display: block; margin-bottom: 3px; font-size: 9.5px; letter-spacing: 0.24em; color: var(--gold-dim); }
  .teach p { margin: 0; font-size: 12.8px; line-height: 1.8; color: var(--text-dim); }
  .fb__acts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .fb__acts .hint { margin-left: auto; }

  /* ---------- 结算 ---------- */
  .result-head { text-align: center; }
  .result-head .eyebrow { margin-bottom: 7px; }
  .result-big {
    font-family: var(--font-num); line-height: 1.1;
    font-size: clamp(46px, 11vw, 64px); letter-spacing: 0.02em;
    color: var(--gold-bright);
  }
  .result-big small { font-family: var(--font-sans); font-size: 13px; letter-spacing: 0.08em; color: var(--text-faint); margin-left: 6px; }
  .rating {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 3px 14px;
    border: 1px solid; border-radius: 999px;
    font-family: var(--font-serif); font-size: 15px; letter-spacing: 0.12em;
  }
  .rating--r4 { color: var(--jade-bright); border-color: rgba(148, 201, 186, 0.52); background: rgba(111, 168, 154, 0.12); }
  .rating--r3 { color: var(--gold-bright); border-color: rgba(201, 168, 106, 0.52); background: rgba(201, 168, 106, 0.11); }
  .rating--r2 { color: var(--text-dim); border-color: var(--line); background: var(--w-01); }
  .rating--r1 { color: var(--cinnabar-bright); border-color: rgba(224, 96, 79, 0.52); background: rgba(184, 71, 60, 0.12); }
  .result-note { margin: 8px 0 0; font-size: 12.5px; color: var(--text-dim); }
  .metrics { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
  .metric {
    min-width: 90px; padding: 9px 13px;
    border: 1px solid var(--line-soft); border-radius: 9px;
    background: var(--w-01);
  }
  .metric b { display: block; font-family: var(--font-num); font-weight: 400; font-size: 18px; line-height: 1.35; color: var(--text); }

<script>
(function () {
  'use strict';

  /* ===== CORE:BEGIN 纯逻辑（无 DOM，可被 Node 自测） ===== */
  const LEVEL_NAMES = { 1: '基础', 2: '进阶', 3: '高阶' };
  const KIND_SCORE = { best: 2, ok: 1, bad: 0 };
  const VERDICT = {
    best: { label: '最佳', icon: '✓' },
    ok: { label: '欠妥', icon: '△' },
    bad: { label: '错误', icon: '✕' },
  };
  const STEP_NAMES = ['了解客户', '定级与事实判断', '方案与产品', '销售动作与后续'];
  const RATINGS = [
    { min: 90, key: 'expert', label: '专业投顾', cls: 'r4', note: '判断稳、动作规范，已经能独立坐诊。' },
    { min: 70, key: 'pass', label: '合格', cls: 'r3', note: '方向正确，几个细节还能更稳。' },
    { min: 50, key: 'improve', label: '待提升', cls: 'r2', note: '关键规则还没吃透，回看复盘再走一遍。' },
    { min: -1, key: 'redline', label: '触碰红线', cls: 'r1', note: '这些做法在真实业务里会踩线，必须纠正。' },
  ];

  function isObj(v) {
    return !!v && typeof v === 'object' && !Array.isArray(v);
  }

  function asText(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/\s+/g, ' ').trim();
  }

  function uniqueStrings(arr) {
    const out = [];
    for (let i = 0; i < arr.length; i += 1) {
      const s = asText(arr[i]);
      if (s && out.indexOf(s) === -1) out.push(s);
    }
    return out;
  }

  function clampScore(n) {
    const num = Number(n);
    if (!Number.isFinite(num)) return 0;
    return Math.max(0, Math.min(100, Math.round(num)));
  }

  function levelName(level) {
    return LEVEL_NAMES[level] || LEVEL_NAMES[1];
  }

  function stepName(index, total) {
    if (total === 4 && STEP_NAMES[index]) return STEP_NAMES[index];
    return '第 ' + (index + 1) + ' 步';
  }

  function ratingOf(pct) {
    const n = clampScore(pct);
    for (let i = 0; i < RATINGS.length; i += 1) {
      if (n >= RATINGS[i].min) return RATINGS[i];
    }
    return RATINGS[RATINGS.length - 1];
  }

  function noteIssue(health, message, skipped) {
    if (!health) return;
    if (!Array.isArray(health.issues)) health.issues = [];
    if (typeof health.skipped !== 'number') health.skipped = 0;
    health.issues.push(message);
    if (skipped) health.skipped += 1;
  }

  function normRisk(v) {
    const s = asText(v).toUpperCase();
    return /^R[1-5]$/.test(s) ? s : '';
  }

  function normClientRisk(v) {
    const s = asText(v).toUpperCase();
    return /^C[1-5]$/.test(s) ? s : '';
  }

  function normalizeProducts(raw, health) {
    const list = [];
    const byId = new Map();
    if (!Array.isArray(raw)) {
      noteIssue(health, '产品目录 window.FINANCE_PRODUCTS 不是数组，产品信息按空目录处理。', true);
      return { list: list, byId: byId };
    }
    raw.forEach(function (p, index) {
      const where = '产品 #' + (index + 1);
      if (!isObj(p)) {
        noteIssue(health, where + ' 不是对象，已跳过。', true);
        return;
      }
      const id = asText(p.id);
      if (!id) {
        noteIssue(health, where + ' 缺少 id，已跳过。', true);
        return;
      }
      if (byId.has(id)) {
        noteIssue(health, where + ' 的 id「' + id + '」重复，已跳过。', true);
        return;
      }
      const name = asText(p.name);
      if (!name) noteIssue(health, where + '（' + id + '）缺少产品名，已用 id 顶替。');
      const item = {
        id: id,
        name: name || id,
        type: asText(p.type),
        risk: normRisk(p.risk),
        term: asText(p.term),
        liq: asText(p.liq),
        min: asText(p.min),
        note: asText(p.note),
      };
      byId.set(id, item);
      list.push(item);
    });
    return { list: list, byId: byId };
  }

  function normalizeClient(raw, health, where) {
    if (!isObj(raw)) {
      noteIssue(health, where + ' 缺少 client 客户档案，相关字段显示为 —。');
    }
    const c = isObj(raw) ? raw : {};
    const labels = [
      ['name', '姓名'], ['age', '年龄'], ['job', '职业'], ['income', '收入'],
      ['assets', '资产'], ['family', '家庭'], ['goal', '目标'], ['stated', '客户原话'], ['risk', '风险等级'],
    ];
    const missing = [];
    labels.forEach(function (pair) {
      if (!asText(c[pair[0]])) missing.push(pair[1]);
    });
    if (missing.length) {
      noteIssue(health, where + ' 客户档案缺少：' + missing.join('、') + '（显示为 —）。');
    }
    return {
      name: asText(c.name) || '未署名客户',
      age: asText(c.age),
      job: asText(c.job),
      income: asText(c.income),
      assets: asText(c.assets),
      family: asText(c.family),
      goal: asText(c.goal),
      stated: asText(c.stated),
      risk: normClientRisk(c.risk),
    };
  }

  function normalizeCases(raw, byProduct, health) {
    const list = [];
    const byId = new Map();
    if (!Array.isArray(raw)) {
      noteIssue(health, '案例库 window.FINANCE_CASES 不是数组，案例列表为空白。', true);
      return { list: list, byId: byId };
    }
    raw.forEach(function (rc, index) {
      const where = '案例 #' + (index + 1);
      if (!isObj(rc)) {
        noteIssue(health, where + ' 不是对象，已跳过。', true);
        return;
      }
      const id = asText(rc.id);
      if (!id) {
        noteIssue(health, where + ' 缺少 id，已跳过。', true);
        return;
      }
      if (byId.has(id)) {
        noteIssue(health, where + ' 的 id「' + id + '」重复，已跳过。', true);
        return;
      }
      const title = asText(rc.title);
      if (!title) {
        noteIssue(health, where + '（' + id + '）缺少标题，已跳过。', true);
        return;
      }
      let level = Number(rc.level);
      if (!Number.isInteger(level) || level < 1 || level > 3) {
        noteIssue(health, where + '（' + id + '）难度无效，已按基础处理。');
        level = 1;
      }
      if (!Array.isArray(rc.tags)) {
        noteIssue(health, where + '（' + id + '）缺少 tags 数组，按无标签处理。');
      }
      const tags = Array.isArray(rc.tags) ? uniqueStrings(rc.tags) : [];
      const client = normalizeClient(rc.client, health, where + '（' + id + '）');

      const rawSteps = Array.isArray(rc.steps) ? rc.steps : [];
      if (!rawSteps.length) noteIssue(health, where + '（' + id + '）缺少 steps 步骤。');
      const steps = [];
      let caseBroken = false;

      rawSteps.forEach(function (rawStep, si) {
        const sw = where + ' 第 ' + (si + 1) + ' 步';
        if (!isObj(rawStep)) {
          noteIssue(health, sw + ' 不是对象，已跳过该步。', true);
          return;
        }
        const q = asText(rawStep.q);
        if (!q) {
          noteIssue(health, sw + ' 缺少问题文本 q，已跳过该步。', true);
          return;
        }
        const rawOpts = Array.isArray(rawStep.options) ? rawStep.options : [];
        if (!rawOpts.length) {
          noteIssue(health, sw + ' 没有 options 选项，已跳过该步。', true);
          return;
        }
        const options = [];
        rawOpts.forEach(function (ro, oi) {
          const ow = sw + ' 选项 ' + (oi + 1);
          if (!isObj(ro)) {
            noteIssue(health, ow + ' 不是对象，已跳过。', true);
            return;
          }
          const t = asText(ro.t);
          const kind = ro.kind;
          const fb = asText(ro.fb);
          if (!t || KIND_SCORE[kind] === undefined || !fb) {
            noteIssue(health, ow + ' 缺少 t / kind / fb 或 kind 非法，已跳过。', true);
            return;
          }
          let product = null;
          if (ro.product !== undefined && ro.product !== null && ro.product !== '') {
            const pid = asText(ro.product);
            if (byProduct && byProduct.has(pid)) {
              product = byProduct.get(pid);
            } else {
              noteIssue(health, ow + ' 引用的产品「' + pid + '」不在目录中，已隐藏产品信息。');
            }
          }
          options.push({ t: t, kind: kind, fb: fb, product: product });
        });
        if (options.length < 2) {
          noteIssue(health, sw + ' 有效选项不足 2 个，已跳过该步。', true);
          return;
        }
        const bests = options.filter(function (o) { return o.kind === 'best'; });
        if (!bests.length) {
          noteIssue(health, sw + ' 没有 kind 为 best 的选项，整个案例不可用。', true);
          caseBroken = true;
          return;
        }
        if (bests.length > 1) {
          noteIssue(health, sw + ' 有 ' + bests.length + ' 个最佳选项，已保留第一个，其余按欠妥计。');
          bests.slice(1).forEach(function (o) { o.kind = 'ok'; });
        }
        steps.push({ q: q, options: options, teach: asText(rawStep.teach) });
      });

      if (caseBroken) return;
      if (!steps.length) {
        noteIssue(health, where + '（' + id + '）没有可用步骤，已跳过。', true);
        return;
      }
      if (steps.length !== 4) {
        noteIssue(health, where + '（' + id + '）有 ' + steps.length + ' 个步骤（常规为 4 个），按实际步骤计分。');
      }
      if (!Array.isArray(rc.lessons)) {
        noteIssue(health, where + '（' + id + '）缺少 lessons 知识要点。');
      }
      const lessons = Array.isArray(rc.lessons) ? uniqueStrings(rc.lessons) : [];
      if (Array.isArray(rc.lessons) && !lessons.length) {
        noteIssue(health, where + '（' + id + '）的 lessons 为空。');
      }
      const reg = asText(rc.reg);
      if (!reg) noteIssue(health, where + '（' + id + '）缺少 reg 相关原则。');

      const item = {
        id: id,
        title: title,
        level: level,
        tags: tags,
        client: client,
        steps: steps,
        lessons: lessons,
        reg: reg,
        order: index,
      };
      list.push(item);
      byId.set(id, item);
    });
    return { list: list, byId: byId };
  }

  function filterCases(cases, filters) {
    const f = filters || {};
    let arr = cases || [];
    if (f.level) {
      arr = arr.filter(function (c) { return String(c.level) === String(f.level); });
    }
    if (f.tag) {
      arr = arr.filter(function (c) { return (c.tags || []).indexOf(f.tag) !== -1; });
    }
    const q = asText(f.q).toLowerCase();
    if (q) {
      const terms = q.split(/\s+/).filter(Boolean);
      arr = arr.filter(function (c) {
        const hay = (c.title + ' ' + (c.client ? c.client.name : '') + ' ' + (c.tags || []).join(' ')).toLowerCase();
        return terms.every(function (t) { return hay.indexOf(t) !== -1; });
      });
    }
    return arr;
  }

  function scoreRun(caseObj, picks) {
    const steps = caseObj && Array.isArray(caseObj.steps) ? caseObj.steps : [];
    let raw = 0;
    steps.forEach(function (step, i) {
      const index = picks ? picks[i] : null;
      const opt = Number.isInteger(index) ? step.options[index] : null;
      if (opt && KIND_SCORE[opt.kind] !== undefined) raw += KIND_SCORE[opt.kind];
    });
    const max = steps.length * 2;
    const pct = max > 0 ? Math.round((raw / max) * 100) : 0;
    return { raw: raw, max: max, pct: pct, rating: ratingOf(pct) };
  }

  function buildKnowledge(cases) {
    const map = new Map();
    function add(text, kind, c) {
      const key = asText(text);
      if (!key) return;
      let entry = map.get(key);
      if (!entry) {
        entry = { text: key, kind: kind, tags: [], sources: [] };
        map.set(key, entry);
      }
      (c.tags || []).forEach(function (t) {
        if (entry.tags.indexOf(t) === -1) entry.tags.push(t);
      });
      if (!entry.sources.some(function (s) { return s.id === c.id; })) {
        entry.sources.push({ id: c.id, title: c.title });
      }
    }
    (cases || []).forEach(function (c) {
      (c.lessons || []).forEach(function (l) { add(l, 'lesson', c); });
      if (c.reg) add(c.reg, 'reg', c);
    });
    return Array.from(map.values()).map(function (e) {
      return {
        text: e.text,
        kind: e.kind,
        tags: e.tags,
        sources: e.sources,
        tag: e.tags[0] || '未分类',
      };
    });
  }

  function groupKnowledge(entries) {
    const map = new Map();
    (entries || []).forEach(function (e) {
      const tags = e.tags && e.tags.length ? e.tags : ['未分类'];
      tags.forEach(function (tag) {
        if (!map.has(tag)) map.set(tag, []);
        map.get(tag).push(e);
      });
    });
    return Array.from(map.keys()).sort(function (a, b) {
      return a.localeCompare(b, 'zh-Hans-CN');
    }).map(function (tag) {
      return { tag: tag, items: map.get(tag) };
    });
  }

  function knowledgeStats(entries, doneIds) {
    const set = new Set(doneIds || []);
    let got = 0;
    (entries || []).forEach(function (e) {
      if (e.sources.some(function (s) { return set.has(s.id); })) got += 1;
    });
    return { got: got, all: (entries || []).length };
  }

  function normalizeProgress(raw, byId) {
    const out = { cases: {}, done: 0 };
    if (!isObj(raw)) return out;
    const src = isObj(raw.cases) ? raw.cases : {};
    Object.keys(src).forEach(function (id) {
      if (byId && !byId.has(id)) return;
      const e = src[id];
      if (!isObj(e)) return;
      const score = clampScore(e.score);
      const best = Math.max(score, clampScore(e.best));
      const ts = Number.isFinite(Number(e.ts)) ? Number(e.ts) : 0;
      out.cases[id] = { score: score, best: best, ts: ts };
    });
    out.done = Object.keys(out.cases).length;
    return out;
  }
  /* ===== CORE:END ===== */

  const G = window.DSHG;
  if (!G || typeof G.el !== 'function') {
    const host = document.getElementById('stage');
    if (host) {
      const msg = document.createElement('p');
      msg.className = 'dim';
      msg.textContent = '页面依赖 assets/common.js，未能加载。请检查文件是否存在后刷新。';
      host.appendChild(msg);
    }
    return;
  }

  const el = G.el;
  const store = G.store;
  const toast = G.toast;
  const stage = document.getElementById('stage');
  const live = document.getElementById('live');

  const health = { issues: [], skipped: 0 };
  const productsData = normalizeProducts(window.FINANCE_PRODUCTS, health);
  const casesData = normalizeCases(window.FINANCE_CASES, productsData.byId, health);

  const state = {
    view: 'home',
    cases: casesData.list,
    byId: casesData.byId,
    products: productsData.byId,
    health: health,
    knowledge: buildKnowledge(casesData.list),
    progress: normalizeProgress(store.get('finance.progress', null), casesData.byId),
    filters: { level: '', tag: '', q: '', page: 1 },
    kb: { q: '' },
    run: null,
    summary: null,
  };

  let overlayEl = null;
  let overlayReturn = null;
  let overlayPrevOverflow = '';

  health.issues.forEach(function (msg) {
    if (window.console && typeof console.warn === 'function') console.warn('[理财诊室] ' + msg);
  });
  if (health.issues.length && window.console && typeof console.warn === 'function') {
    console.warn('[理财诊室] 数据自检完成：' + health.issues.length + ' 条提示，跳过 ' + health.skipped + ' 条数据。');
  }

  /* ---------- 小工具 ---------- */
  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function scrollTop() {
    try { window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); }
    catch (err) { try { window.scrollTo(0, 0); } catch (err2) { /* 忽略 */ } }
  }

  function announce(text) {
    if (live) live.textContent = text;
  }

  function mount(node, opts) {
    const o = opts || {};
    stage.replaceChildren(node);
    if (o.animate !== false) node.classList.add('screen');
    if (!o.keepScroll) scrollTop();
  }

  function tagNode(text, cls) {
    return el('span', { class: 'tag' + (cls ? ' ' + cls : ''), text: text });
  }

  function levelBadge(level) {
    return el('span', { class: 'lv lv--' + level, text: levelName(level) });
  }

  function ageText(age) {
    const s = asText(age);
    if (!s) return '—';
    return /^\d+$/.test(s) ? s + ' 岁' : s;
  }

  function clientBrief(client, withRisk) {
    if (!client) return '';
    const parts = [];
    if (client.age) parts.push(ageText(client.age));
    if (client.job) parts.push(client.job);
    if (withRisk && client.risk) parts.push(client.risk);
    return parts.join(' · ');
  }

  function sectionHead(title, en) {
    return el('div', { class: 'section-head' }, [
      el('h2', { text: title }),
      el('span', { text: en }),
    ]);
  }

  function metric(value, label) {
    return el('div', { class: 'metric' }, [
      el('b', { text: value }),
      el('span', { text: label }),
    ]);
  }

  function kbd(text) {
    return el('span', { class: 'kbd num', text: text });
  }

  function statCard(label, value, note, cls) {
    return el('div', { class: 'stat' + (cls ? ' ' + cls : '') }, [
      el('span', { class: 'stat__k', text: label }),
      el('span', { class: 'stat__v', text: value }),
      el('span', { class: 'stat__n', text: note }),
    ]);
  }

  function emptyPanel(mark, title, text, actions) {
    return el('div', { class: 'empty' }, [
      el('div', { class: 'empty__mark', text: mark }),
      el('h3', { text: title }),
      el('p', { text: text }),
      actions || null,
    ]);
  }

  function dataBar() {
    if (!state.health.issues.length) return null;
    const n = state.health.issues.length;
    const skipped = state.health.skipped;
    const msg = skipped
      ? '发现 ' + n + ' 处数据问题，已跳过 ' + skipped + ' 条不可用数据，其余照常加载。'
      : '发现 ' + n + ' 处数据问题，已自动兼容，页面照常可用。';
    return el('div', { class: 'databar', role: 'status' }, [
      el('b', { text: '数据自检' }),
      el('span', { text: msg }),
      el('span', { class: 'databar__hint', text: '详情见控制台 console.warn' }),
    ]);
  }

  function persist() {
    state.progress.done = Object.keys(state.progress.cases).length;
    store.set('finance.progress', {
      cases: state.progress.cases,
      done: state.progress.done,
    });
  }

  function homeStats() {
    const ids = Object.keys(state.progress.cases).filter(function (id) { return state.byId.has(id); });
    let sum = 0;
    let bestPct = -1;
    ids.forEach(function (id) {
      const rec = state.progress.cases[id];
      sum += rec.score;
      if (rec.best > bestPct) bestPct = rec.best;
    });
    const kb = knowledgeStats(state.knowledge, ids);
    return {
      completed: ids.length,
      avg: ids.length ? Math.round(sum / ids.length) : 0,
      bestPct: bestPct,
      bestRating: bestPct >= 0 ? ratingOf(bestPct) : null,
      kbGot: kb.got,
      kbAll: kb.all,
    };
  }

  /* ---------- 首页 ---------- */
  function paintHome() {
    state.view = 'home';
    state.run = null;
    const stats = homeStats();
    const root = el('div', { class: 'home' });
    const bar = dataBar();
    if (bar) root.appendChild(bar);

    root.appendChild(el('section', { class: 'hero' }, [
      el('div', { class: 'eyebrow', text: '理财诊室 · 银行从业 / 案例式决策' }),
      el('h1', {}, [
        '一位客户进门，', el('em', { text: '四步' }), '处理完。',
      ]),
      el('p', {
        class: 'lede',
        text: '不是四选一答题：先了解客户，再定级与事实判断，然后配方案和产品，最后做销售动作与后续。每选一步立刻给反馈，走完给总分、评级与逐步复盘。',
      }),
      el('p', {
        class: 'lede',
        text: '案例库、产品目录、知识要点都从 data 目录读取；进度只存在本机浏览器里。',
      }),
      el('div', { class: 'hero__acts' }, [
        el('button', {
          class: 'btn btn--ghost', type: 'button', onclick: paintKnowledge,
        }, '知识库 · ' + state.knowledge.length + ' 条'),
      ]),
    ]));

    root.appendChild(el('section', { class: 'stats', 'aria-label': '学习统计' }, [
      statCard('已完成案例', String(stats.completed), '共 ' + state.cases.length + ' 个案例', ''),
      statCard('平均分', stats.completed ? String(stats.avg) : '—', stats.completed ? '按最近一次成绩计算' : '完成一个案例后生成', 'stat--jade'),
      statCard('最佳评级', stats.bestRating ? stats.bestRating.label : '—', stats.bestRating ? '最佳成绩 ' + stats.bestPct + ' 分' : '完成一个案例后生成', 'stat--azure'),
      statCard('累计知识要点', String(stats.kbGot), '全库 ' + stats.kbAll + ' 条 · 去重后', 'stat--cin'),
    ]));

    if (!state.cases.length) {
      root.appendChild(el('section', { class: 'panel', style: { marginTop: '18px' } }, [
        emptyPanel('空', '案例库还是空的', '请确认 data/finance-cases.js 已正确定义 window.FINANCE_CASES，然后刷新页面。产品目录与知识库入口仍然可用。', el('button', {
          class: 'btn btn--ghost', type: 'button', onclick: paintKnowledge,
        }, '先看看知识库')),
      ]));
    } else {
      root.appendChild(sectionHead('候诊名单', 'CASES · ' + state.cases.length));
      root.appendChild(buildCaseBrowser());
    }

    root.appendChild(el('div', { class: 'home__foot' }, [
      el('button', { class: 'linkish', type: 'button', onclick: openClearProgress }, '清空进度'),
      el('span', { text: '进度只保存在本机浏览器；换设备不会同步' }),
    ]));

    mount(root);
    announce('理财诊室首页。已完成 ' + stats.completed + ' 个案例。');
  }

  function buildCaseBrowser() {
    const panel = el('section', { class: 'panel filters-panel' });
    const gridHost = el('div', { class: 'case-grid' });
    const countHost = el('div', { class: 'count-line' });
    const pagerHost = el('div', { class: 'pager' });

    const allTags = [];
    state.cases.forEach(function (c) {
      c.tags.forEach(function (t) {
        if (allTags.indexOf(t) === -1) allTags.push(t);
      });
    });
    allTags.sort(function (a, b) { return a.localeCompare(b, 'zh-Hans-CN'); });

    const levelSel = el('select', {
      'aria-label': '按难度筛选',
      onchange: function () {
        state.filters.level = levelSel.value;
        state.filters.page = 1;
        renderList();
      },
    }, [
      el('option', { value: '' }, '全部难度'),
      el('option', { value: '1' }, '基础'),
      el('option', { value: '2' }, '进阶'),
      el('option', { value: '3' }, '高阶'),
    ]);
    levelSel.value = state.filters.level;

    const tagSel = el('select', {
      'aria-label': '按标签筛选',
      onchange: function () {
        state.filters.tag = tagSel.value;
        state.filters.page = 1;
        renderList();
      },
    }, [el('option', { value: '' }, '全部标签')].concat(allTags.map(function (t) {
      return el('option', { value: t }, t);
    })));
    tagSel.value = state.filters.tag;

    const search = el('input', {
      type: 'search',
      placeholder: '搜案例标题、客户名、标签…',
      'aria-label': '搜索案例',
      oninput: function () {
        state.filters.q = search.value;
        state.filters.page = 1;
        renderList();
      },
    });
    search.value = state.filters.q;

    panel.appendChild(el('div', { class: 'filters' }, [
      levelSel,
      tagSel,
      el('div', { class: 'search' }, search),
    ]));
    panel.appendChild(countHost);
    panel.appendChild(gridHost);
    panel.appendChild(pagerHost);

    function renderList(jump) {
      const list = filterCases(state.cases, state.filters);
      const pageSize = 12;
      const pages = Math.max(1, Math.ceil(list.length / pageSize));
      if (state.filters.page > pages) state.filters.page = pages;
      if (state.filters.page < 1) state.filters.page = 1;
      const page = state.filters.page;
      const start = (page - 1) * pageSize;
      const slice = list.slice(start, start + pageSize);
      const filteredOn = !!(state.filters.level || state.filters.tag || state.filters.q);
      const from = list.length ? start + 1 : 0;
      const to = Math.min(list.length, start + pageSize);

      const countKids = [
        el('span', { text: '共 ' + list.length + ' 个案例' + (filteredOn ? ' · 已筛选' : '') + ' · 显示 ' + from + '–' + to }),
      ];
      if (filteredOn) {
        countKids.push(el('button', {
          class: 'linkish', type: 'button',
          onclick: function () {
            state.filters.level = '';
            state.filters.tag = '';
            state.filters.q = '';
            state.filters.page = 1;
            paintHome();
          },
        }, '清除筛选'));
      }
      countHost.replaceChildren.apply(countHost, countKids);

      if (!slice.length) {
        gridHost.replaceChildren(emptyPanel(
          '空',
          filteredOn ? '没有匹配的案例' : '案例库还是空的',
          filteredOn ? '换个关键词，或把难度、标签调回“全部”再试。' : '等 data/finance-cases.js 写入数据后刷新页面即可。',
          filteredOn ? el('button', {
            class: 'btn btn--ghost', type: 'button',
            onclick: function () {
              state.filters.level = '';
              state.filters.tag = '';
              state.filters.q = '';
              state.filters.page = 1;
              paintHome();
            },
          }, '清除筛选') : null
        ));
        gridHost.firstChild.style.gridColumn = '1 / -1';
      } else {
        gridHost.replaceChildren.apply(gridHost, slice.map(caseCard));
      }

      const kids = [];
      kids.push(el('button', {
        class: 'pager__btn', type: 'button', disabled: page <= 1,
        'aria-label': '上一页',
        onclick: function () { state.filters.page = page - 1; renderList(true); },
      }, '‹'));
      pageWindow(page, pages).forEach(function (p) {
        if (p === '…') {
          kids.push(el('span', { class: 'pager__dots', text: '…' }));
          return;
        }
        kids.push(el('button', {
          class: 'pager__btn' + (p === page ? ' is-on' : ''),
          type: 'button', text: String(p),
          'aria-label': '第 ' + p + ' 页',
          'aria-current': p === page ? 'page' : null,
          onclick: function () { state.filters.page = p; renderList(true); },
        }));
      });
      kids.push(el('button', {
        class: 'pager__btn', type: 'button', disabled: page >= pages,
        'aria-label': '下一页',
        onclick: function () { state.filters.page = page + 1; renderList(true); },
      }, '›'));
      kids.push(el('span', { class: 'pager__info', text: page + ' / ' + pages + ' 页' }));
      pagerHost.replaceChildren.apply(pagerHost, kids);

      if (jump) {
        try { panel.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
        catch (err) { try { panel.scrollIntoView(); } catch (err2) { /* 忽略 */ } }
      }
    }

    const result = el('div', {});
    result.appendChild(panel);
    renderList();
    return result;
  }

  function caseCard(c) {
    const rec = state.progress.cases[c.id];
    const rating = rec ? ratingOf(rec.score) : null;
    let foot;
    if (rec) {
      foot = el('span', { class: 'case-card__done' }, [
        el('b', { text: String(rec.score) }),
        ' 分 · ' + rating.label,
        rec.best > rec.score ? el('span', { class: 'case-card__best', text: ' · 最佳 ' + rec.best }) : null,
      ]);
    } else {
      foot = el('span', { text: '未完成 · ' + c.steps.length + ' 步' });
    }
    const tags = el('div', { class: 'case-card__tags' }, c.tags.slice(0, 4).map(function (t) {
      return tagNode(t, 'tag--dim');
    }));
    return el('button', {
      class: 'case-card', type: 'button',
      'aria-label': '进入案例：' + c.title,
      onclick: function () { startCase(c.id); },
    }, [
      el('div', { class: 'case-card__top' }, [
        el('h3', { class: 'case-card__title', text: c.title }),
        levelBadge(c.level),
      ]),
      el('p', { class: 'case-card__client', text: clientBrief(c.client, true) || '客户画像待补充' }),
      c.client.goal ? el('p', { class: 'case-card__goal', text: c.client.goal }) : null,
      tags,
      el('div', { class: 'case-card__foot' }, [
        foot,
        el('span', { class: 'case-card__go', text: '进入 →' }),
      ]),
    ]);
  }

  function pageWindow(current, pages) {
    if (pages <= 7) {
      const arr = [];
      for (let i = 1; i <= pages; i += 1) arr.push(i);
      return arr;
    }
    const set = new Set([1, pages, current - 1, current, current + 1]);
    const arr = Array.from(set).filter(function (p) { return p >= 1 && p <= pages; })
      .sort(function (a, b) { return a - b; });
    const out = [];
    for (let i = 0; i < arr.length; i += 1) {
      if (i > 0 && arr[i] - arr[i - 1] > 1) out.push('…');
      out.push(arr[i]);
    }
    return out;
  }

  /* ---------- 案例页 ---------- */
  function startCase(id) {
    const c = state.byId.get(id);
    if (!c) {
      toast('这个案例的数据不可用。');
      return;
    }
    state.run = {
      caseId: id,
      step: 0,
      picks: [],
      answered: false,
      chosen: -1,
      finished: false,
    };
    state.summary = null;
    paintCase();
  }

  function paintCase() {
    state.view = 'case';
    const run = state.run;
    if (!run) { paintHome(); return; }
    const c = state.byId.get(run.caseId);
    if (!c) { state.run = null; paintHome(); return; }
    const step = c.steps[run.step];
    if (!step) { state.run = null; paintHome(); return; }
    const total = c.steps.length;

    const root = el('div', { class: 'case-page' });
    const bar = dataBar();
    if (bar) root.appendChild(bar);
    root.appendChild(caseHead(c, run, total));
    root.appendChild(clientCard(c.client));
    root.appendChild(questionCard(c, run, step, total));
    mount(root);

    if (run.answered) {
      requestAnimationFrame(function () {
        try {
          const fb = stage.querySelector('.fb');
          if (fb) fb.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' });
        } catch (err) { /* 忽略 */ }
      });
    }
  }

  function caseHead(c, run, total) {
    const pct = ((run.step + (run.answered ? 1 : 0)) / total) * 100;
    return el('header', { class: 'case-head' }, [
      el('button', { class: 'back', type: 'button', onclick: leaveCase }, '← 返回案例列表'),
      el('div', { class: 'case-head__row' }, [
        levelBadge(c.level),
        el('h1', { class: 'case-head__title', text: c.title }),
      ]),
      el('div', { class: 'step-hud' }, [
        el('div', { class: 'step-hud__row' }, [
          el('span', {
            class: 'step-hud__label',
            text: '第 ' + (run.step + 1) + ' / ' + total + ' 步 · ' + stepName(run.step, total),
          }),
          el('span', { class: 'step-hud__count num', text: Math.round(pct) + '%' }),
        ]),
        el('div', {
          class: 'meter', role: 'progressbar',
          'aria-valuemin': '0',
          'aria-valuemax': String(total),
          'aria-valuenow': String(run.step + (run.answered ? 1 : 0)),
          'aria-label': '案例步骤进度',
        }, el('i', { style: { width: pct.toFixed(1) + '%' } })),
      ]),
    ]);
  }

  function clientCard(cl) {
    function field(label, value, wide) {
      return el('div', { class: 'client-field' + (wide ? ' client-field--wide' : '') }, [
        el('dt', { text: label }),
        el('dd', { text: value || '—' }),
      ]);
    }
    return el('section', { class: 'client-card', 'aria-label': '客户档案' }, [
      el('div', { class: 'client-card__head' }, [
        el('span', { class: 'client-card__kicker', text: '客户档案' }),
        el('span', { class: 'client-card__name', text: cl.name }),
        el('span', { class: 'client-card__meta', text: clientBrief(cl, false) }),
      ]),
      el('dl', { class: 'client-grid' }, [
        field('年龄', cl.age ? ageText(cl.age) : '—', false),
        field('职业', cl.job, false),
        field('收入', cl.income, false),
        field('资产', cl.assets, false),
        field('家庭', cl.family, true),
        field('目标', cl.goal, true),
      ]),
      cl.stated ? el('blockquote', { class: 'client-quote' }, [
        el('span', { text: '“' + cl.stated + '”' }),
        el('cite', { text: '客户原话' }),
      ]) : null,
    ]);
  }

  function questionCard(c, run, step, total) {
    const panel = el('section', { class: 'panel case-q' });
    panel.appendChild(el('div', { class: 'q-label', text: '第 ' + (run.step + 1) + ' 步 · ' + stepName(run.step, total) }));
    panel.appendChild(el('h2', { class: 'q-text', text: step.q }));

    const opts = el('div', { class: 'opts', role: 'group', 'aria-label': '本步选项' });
    step.options.forEach(function (opt, i) {
      opts.appendChild(optionNode(opt, i, run));
    });
    panel.appendChild(opts);

    if (run.answered) {
      panel.appendChild(feedbackNode(c, run, step));
    } else {
      const n = step.options.length;
      panel.appendChild(el('div', { class: 'qfoot' }, [
        el('span', { class: 'hint' }, [
          '按 ', kbd('1'), ' – ', kbd(String(n)), ' 选择；选完立刻给反馈',
        ]),
      ]));
    }
    return panel;
  }

  function optionNode(opt, i, run) {
    const answered = run.answered;
    const picked = answered && i === run.chosen;
    const v = VERDICT[opt.kind];
    let cls = 'opt';
    if (answered) cls += ' is-' + opt.kind;
    if (picked) cls += ' is-picked';
    else if (answered) cls += ' is-muted';

    const rowKids = [el('span', { class: 'opt__t', text: opt.t })];
    if (answered) {
      rowKids.push(el('span', { class: 'opt__badge opt__badge--' + opt.kind }, [
        el('span', { 'aria-hidden': 'true', text: v.icon }),
        el('span', { text: v.label }),
      ]));
    }
    const body = el('div', { class: 'opt__body' }, [
      el('div', { class: 'opt__row' }, rowKids),
    ]);
    if (opt.product) body.appendChild(productBlock(opt.product));
    if (picked) body.appendChild(el('span', { class: 'opt__picked', text: '你的选择' }));

    const btn = el('button', {
      class: cls, type: 'button',
      'aria-pressed': picked ? 'true' : 'false',
      onclick: function () { chooseOption(i); },
    }, [
      el('span', { class: 'opt__no num', text: String(i + 1) }),
      body,
    ]);
    if (answered) btn.disabled = true;
    return btn;
  }

  function productBlock(p) {
    return el('div', { class: 'prod' }, [
      el('div', { class: 'prod__head' }, [
        el('span', { class: 'prod__name', text: '产品 · ' + p.name }),
        p.type ? el('span', { class: 'prod__type', text: p.type }) : null,
      ]),
      el('div', { class: 'prod__grid' }, [
        el('span', {}, [el('b', { text: '风险' }), el('em', { class: 'prod__risk', text: p.risk || '—' })]),
        el('span', {}, [el('b', { text: '期限' }), p.term || '—']),
        el('span', {}, [el('b', { text: '起投' }), p.min || '—']),
        el('span', {}, [el('b', { text: '流动性' }), p.liq || '—']),
      ]),
      p.note ? el('p', { class: 'prod__note', text: '提示：' + p.note }) : null,
    ]);
  }

  function chooseOption(index) {
    const run = state.run;
    if (!run || run.finished || run.answered) return;
    const c = state.byId.get(run.caseId);
    if (!c) return;
    const step = c.steps[run.step];
    if (!step) return;
    if (!Number.isInteger(index) || index < 0 || index >= step.options.length) return;

    run.answered = true;
    run.chosen = index;
    run.picks[run.step] = index;
    const v = VERDICT[step.options[index].kind];
    announce('第 ' + (run.step + 1) + ' 步已选：' + v.label + '。' +
      (step.options[index].kind === 'best' ? '这是最佳做法。' : '已展开反馈与知识点。'));
    paintCase();
  }

  function feedbackNode(c, run, step) {
    const opt = step.options[run.chosen];
    const v = VERDICT[opt.kind];
    const titles = {
      best: '这是最佳做法',
      ok: '可以接受，但不够好',
      bad: '这一步选错了',
    };
    const fb = el('div', { class: 'fb fb--' + opt.kind });
    fb.appendChild(el('div', { class: 'fb__verdict' }, [
      el('span', { class: 'fb__icon', 'aria-hidden': 'true', text: v.icon }),
      el('span', { text: titles[opt.kind] }),
      el('span', { class: 'fb__earn', text: '+' + KIND_SCORE[opt.kind] + ' 分' }),
    ]));
    fb.appendChild(el('p', { class: 'fb__chosen', text: '你选了：' + opt.t }));
    fb.appendChild(el('p', { class: 'fb__text', text: opt.fb }));
    if (step.teach) {
      fb.appendChild(el('div', { class: 'teach' }, [
        el('span', { class: 'teach__k', text: '这一步要记住' }),
        el('p', { text: step.teach }),
      ]));
    }
    const last = run.step >= c.steps.length - 1;
    fb.appendChild(el('div', { class: 'fb__acts' }, [
      el('button', {
        class: 'btn', type: 'button', onclick: nextStep,
      }, last ? '查看结算' : '下一步'),
      el('span', { class: 'hint' }, [kbd('Enter'), ' 继续']),
    ]));
    return fb;
  }

  function nextStep() {
    const run = state.run;
    if (!run || run.finished || !run.answered) return;
    const c = state.byId.get(run.caseId);
    if (!c) return;
    if (run.step >= c.steps.length - 1) {
      finishCase();
      return;
    }
    run.step += 1;
    run.answered = false;
    run.chosen = -1;
    paintCase();
  }

  function finishCase() {
    const run = state.run;
    if (!run || run.finished) return;
    const c = state.byId.get(run.caseId);
    if (!c) return;
    if (run.picks.length < c.steps.length) {
      toast('还有步骤没有完成。');
      return;
    }
    for (let i = 0; i < c.steps.length; i += 1) {
      if (!Number.isInteger(run.picks[i]) || run.picks[i] < 0 || run.picks[i] >= c.steps[i].options.length) {
        toast('这一步的选择数据不完整，请重做本案例。');
        return;
      }
    }

    run.finished = true;
    const result = scoreRun(c, run.picks);
    const reviews = c.steps.map(function (step, i) {
      const chosen = step.options[run.picks[i]];
      let best = chosen;
      for (let k = 0; k < step.options.length; k += 1) {
        if (step.options[k].kind === 'best') { best = step.options[k]; break; }
      }
      return {
        index: i,
        label: stepName(i, c.steps.length),
        q: step.q,
        chosen: chosen,
        best: best,
        verdict: chosen.kind,
      };
    });

    const prev = state.progress.cases[c.id];
    const bestScore = Math.max(prev && Number.isFinite(prev.best) ? prev.best : 0, result.pct);
    state.progress.cases[c.id] = {
      score: result.pct,
      best: bestScore,
      ts: Date.now(),
    };
    persist();

    const summary = {
      caseId: c.id,
      title: c.title,
      raw: result.raw,
      max: result.max,
      pct: result.pct,
      rating: result.rating,
      reviews: reviews,
      lessons: c.lessons,
      reg: c.reg,
      best: bestScore,
    };
    state.summary = summary;
    state.run = null;
    paintResult();
    announce('案例结算：' + result.pct + ' 分，' + result.rating.label + '。');
  }

  /* ---------- 结算 ---------- */
  function paintResult() {
    state.view = 'result';
    const s = state.summary;
    if (!s) { paintHome(); return; }
    const c = state.byId.get(s.caseId);
    const rating = s.rating || ratingOf(s.pct);

    const root = el('div', { class: 'result-page' });
    const bar = dataBar();
    if (bar) root.appendChild(bar);

    const panel = el('section', { class: 'panel result-panel' });
    panel.appendChild(el('div', { class: 'result-head' }, [
      el('div', { class: 'eyebrow', text: '案例结算 · ' + (c ? c.title : s.title) }),
      el('div', { class: 'result-big num' }, [
        String(s.pct),
        el('small', { text: '/ 100' }),
      ]),
      el('span', { class: 'rating rating--' + rating.cls, text: rating.label }),
      el('p', { class: 'result-note', text: rating.note }),
      el('div', { class: 'metrics' }, [
        metric(s.raw + ' / ' + s.max, '原始得分'),
        metric(String(s.reviews.length), '完成步骤'),
        metric(s.best + ' 分', s.best > s.pct ? '历史最佳' : '本次即最佳'),
      ]),
    ]));

    panel.appendChild(el('hr', { class: 'rule' }));

    const reviewSection = el('div', { class: 'result-section' }, [
      sectionHead('逐步复盘', 'STEP BY STEP'),
    ]);
    s.reviews.forEach(function (r) {
      reviewSection.appendChild(reviewNode(r));
    });
    panel.appendChild(reviewSection);

    panel.appendChild(el('hr', { class: 'rule' }));
    panel.appendChild(lessonsSection(s));

    panel.appendChild(el('div', { class: 'result-acts' }, [
      el('button', {
        class: 'btn', type: 'button',
        onclick: function () { startCase(s.caseId); },
      }, '重做本案例'),
      el('button', {
        class: 'btn btn--ghost', type: 'button', onclick: gotoNextCase,
      }, '下一个案例'),
      el('button', {
        class: 'btn btn--ghost', type: 'button', onclick: paintHome,
      }, '返回列表'),
      el('button', {
        class: 'btn btn--ghost', type: 'button', onclick: paintKnowledge,
      }, '知识库'),
    ]));
    panel.appendChild(el('p', { class: 'result-fine', text: '成绩已写入本机存档；重做会更新最近成绩，历史最佳单独保留。' }));

    root.appendChild(panel);
    mount(root);
  }

  function reviewNode(r) {
    function row(term, value, mod) {
      return el('div', { class: 'review__row' + (mod ? ' review__row--' + mod : '') }, [
        el('dt', { text: term }),
        el('dd', { text: value }),
      ]);
    }
    const v = VERDICT[r.verdict];
    const rows = [
      row('你的选择', r.chosen.t),
      row('更优做法', r.chosen === r.best ? '你的选择就是这一步的最佳做法。' : r.best.t, 'better'),
      row('为什么', r.chosen.fb, 'why'),
    ];
    if (r.chosen !== r.best) rows.push(row('更优的理由', r.best.fb, 'why'));

    return el('article', { class: 'review' }, [
      el('div', { class: 'review__head' }, [
        el('span', { class: 'review__step', text: '第 ' + (r.index + 1) + ' 步 · ' + r.label }),
        el('span', { class: 'vdict vdict--' + r.verdict }, [
          el('span', { 'aria-hidden': 'true', text: v.icon }),
          el('span', { text: v.label }),
        ]),
      ]),
      el('p', { class: 'review__q', text: r.q }),
      el('dl', { class: 'review__rows' }, rows),
    ]);
  }

  function lessonsSection(s) {
    const list = el('ul', { class: 'lessons' });
    (s.lessons || []).forEach(function (lesson, i) {
      list.appendChild(el('li', {}, [
        el('span', { class: 'lesson__no num', text: String(i + 1).padStart(2, '0') }),
        el('span', { text: lesson }),
      ]));
    });
    return el('div', { class: 'result-section' }, [
      sectionHead('这个案例的知识要点', 'LESSONS'),
      s.lessons && s.lessons.length
        ? list
        : el('p', { class: 'dim', text: '这个案例还没有录入知识要点。' }),
      s.reg ? el('div', { class: 'reg' }, [
        el('b', { text: '相关原则' }),
        el('span', { text: s.reg }),
      ]) : null,
    ]);
  }

  function gotoNextCase() {
    if (!state.summary) { paintHome(); return; }
    if (!state.cases.length) { paintHome(); return; }
    const idx = state.cases.findIndex(function (c) { return c.id === state.summary.caseId; });
    if (idx === -1) { startCase(state.cases[0].id); return; }
    startCase(state.cases[(idx + 1) % state.cases.length].id);
  }

  function leaveCase() {
    state.run = null;
    paintHome();
    toast('已退出本案例，未完成的步骤不计分。');
  }

  /* ---------- 知识库 ---------- */
  function paintKnowledge() {
    state.view = 'kb';
    const root = el('div', { class: 'kb-page' });
    const bar = dataBar();
    if (bar) root.appendChild(bar);

    const sources = new Set();
    state.knowledge.forEach(function (e) {
      e.sources.forEach(function (s) { sources.add(s.id); });
    });

    root.appendChild(el('div', { class: 'kb-head' }, [
      el('div', {}, [
        el('div', { class: 'eyebrow', text: '知识库 · 规则与要点' }),
        el('h1', { text: '把规则，按标签收好。' }),
        el('p', { text: '共 ' + state.knowledge.length + ' 条去重后的知识要点，来自 ' + sources.size + ' 个案例 · 点开案例可以回到实战' }),
      ]),
      el('div', { class: 'cards-head__act' }, [
        el('button', { class: 'back', type: 'button', onclick: paintHome }, '← 回首页'),
      ]),
    ]));

    const panel = el('section', { class: 'panel kb-panel' });
    const search = el('input', {
      type: 'search',
      placeholder: '搜知识要点、标签、案例标题…',
      'aria-label': '搜索知识库',
      oninput: function () {
        state.kb.q = search.value;
        renderKb();
      },
    });
    search.value = state.kb.q;

    const countHost = el('p', { class: 'kb-count' });
    const groupsHost = el('div', { class: 'kb-groups' });

    panel.appendChild(el('div', { class: 'search' }, search));
    panel.appendChild(countHost);
    panel.appendChild(groupsHost);
    root.appendChild(panel);

    function renderKb() {
      const q = asText(state.kb.q).toLowerCase();
      const terms = q ? q.split(/\s+/).filter(Boolean) : [];
      const entries = terms.length
        ? state.knowledge.filter(function (e) {
          const hay = (e.text + ' ' + e.tags.join(' ') + ' ' + e.sources.map(function (s) { return s.title; }).join(' ')).toLowerCase();
          return terms.every(function (t) { return hay.indexOf(t) !== -1; });
        })
        : state.knowledge;
      const groups = groupKnowledge(entries);

      countHost.textContent = terms.length
        ? '匹配 ' + entries.length + ' 条 · 分布在 ' + groups.length + ' 个标签'
        : '全部 ' + entries.length + ' 条 · 按标签分组（同一要点可出现在多个标签下）';

      if (!entries.length) {
        groupsHost.replaceChildren(emptyPanel(
          '空',
          terms.length ? '没有匹配的知识要点' : '知识库还是空的',
          terms.length ? '换个关键词，或直接清空搜索框。' : '等案例数据里的 lessons 与 reg 写入后刷新页面即可。',
          terms.length ? el('button', {
            class: 'btn btn--ghost', type: 'button',
            onclick: function () {
              state.kb.q = '';
              paintKnowledge();
            },
          }, '清空搜索') : null
        ));
        return;
      }

      groupsHost.replaceChildren.apply(groupsHost, groups.map(function (g) {
        return el('section', { class: 'kb-group' }, [
          el('div', { class: 'kb-group__head' }, [
            el('h2', { text: g.tag }),
            el('span', { class: 'kb-group__count', text: g.items.length + ' 条' }),
          ]),
          el('div', { class: 'kb-list' }, g.items.map(kbItem)),
        ]);
      }));
    }

    root.appendChild(el('div', { class: 'home__foot' }, [
      el('span', { text: '去重规则：同一句话只保留一条；来源案例会合并显示。' }),
      el('button', { class: 'linkish', type: 'button', onclick: paintHome }, '返回案例列表'),
    ]));

    mount(root);
    renderKb();
    announce('知识库，共 ' + state.knowledge.length + ' 条知识要点。');
  }

  function kbItem(e) {
    const isReg = e.kind === 'reg';
    return el('article', { class: 'kb-item' + (isReg ? ' kb-item--reg' : '') }, [
      el('p', { class: 'kb-item__text', text: e.text }),
      el('div', { class: 'kb-item__meta' }, [
        el('span', { class: 'kb-type' + (isReg ? ' kb-type--reg' : ''), text: isReg ? '原则' : '要点' }),
      ].concat(e.tags.map(function (t) {
        return tagNode(t, 'tag--dim');
      })).concat([
        el('span', { class: 'kb-src', text: '来自《' + e.sources.map(function (s) { return s.title; }).join('》《') + '》' }),
      ])),
    ]);
  }

  /* ---------- 清空进度 ---------- */
  function closeOverlay(silent) {
    if (!overlayEl) return;
    const ret = overlayReturn;
    overlayEl.remove();
    overlayEl = null;
    document.body.style.overflow = overlayPrevOverflow || '';
    overlayPrevOverflow = '';
    overlayReturn = null;
    if (!silent && ret && ret.isConnected && typeof ret.focus === 'function') ret.focus();
  }

  function openOverlay(opt) {
    closeOverlay(true);
    overlayReturn = document.activeElement;
    overlayPrevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    const closeBtn = el('button', {
      class: 'overlay__close', type: 'button', 'aria-label': '关闭',
      onclick: function () { closeOverlay(); },
    }, '×');

    const panel = el('div', {
      class: 'panel overlay__panel', role: 'dialog', 'aria-modal': 'true',
      'aria-labelledby': 'overlay-title',
    }, [
      closeBtn,
      el('div', { class: 'overlay__head' }, [
        opt.eyebrow ? el('div', { class: 'eyebrow', text: opt.eyebrow }) : null,
        el('h2', { id: 'overlay-title', text: opt.title || '' }),
      ]),
      el('div', { class: 'overlay__body' }, opt.body || []),
      opt.actions ? el('div', { class: 'overlay__acts' }, opt.actions) : null,
    ]);

    overlayEl = el('div', {
      class: 'overlay',
      onclick: function (e) { if (e.target === overlayEl) closeOverlay(); },
    }, panel);
    document.body.appendChild(overlayEl);
    closeBtn.focus();
  }

  function openClearProgress() {
    const stats = homeStats();
    openOverlay({
      eyebrow: '清空进度',
      title: '真的清零？',
      body: [
        el('p', { text: '已完成 ' + stats.completed + ' 个案例，平均 ' + (stats.completed ? stats.avg + ' 分' : '—') + '，最佳评级 ' + (stats.bestRating ? stats.bestRating.label : '—') + '。' }),
        el('p', { text: '所有案例成绩、历史最佳与统计都会被清掉；案例库和知识库本身不受影响。此操作不可撤销。' }),
      ],
      actions: [
        el('button', { class: 'btn btn--ghost', type: 'button', onclick: function () { closeOverlay(); } }, '取消'),
        el('button', {
          class: 'btn btn--cinnabar', type: 'button',
          onclick: function () {
            store.del('finance.progress');
            state.progress = { cases: {}, done: 0 };
            closeOverlay();
            toast('进度已清空。');
            paintHome();
          },
        }, '确认清空'),
      ],
    });
  }

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (overlayEl) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeOverlay();
        return;
      }
      if (e.key === 'Tab') {
        const focusables = Array.from(overlayEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
          .filter(function (n) { return !n.disabled; });
        if (focusables.length) {
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
      return;
    }
    if (state.view !== 'case' || !state.run) return;
    const run = state.run;
    if (run.answered) {
      if (e.key === 'Enter') {
        e.preventDefault();
        nextStep();
      }
      return;
    }
    if (e.key.length === 1) {
      const idx = Number(e.key) - 1;
      const step = state.byId.get(run.caseId) ? state.byId.get(run.caseId).steps[run.step] : null;
      if (Number.isInteger(idx) && idx >= 0 && idx < 4 && step && idx < step.options.length) {
        e.preventDefault();
        chooseOption(idx);
      }
    }
  });

  window.addEventListener('pagehide', function () {
    if (state.progress && state.progress.done >= 0) {
      // 结算时已经写入；这里只做一次兜底，避免存档字段缺 done。
      persist();
    }
  });

  /* ---------- 启动 ---------- */
  G.mountChrome({ title: '理财诊室 · 银行从业', meta: 'FINANCE · CASE PRACTICE' });
  paintHome();
})();
</script>
</body>
</html>
